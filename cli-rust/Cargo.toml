[package]
name = "klardrop"
version = "0.1.0"
edition = "2021"
# The floor of the locked dependency graph, not a guess: `ureq` pulls `url`, which pulls
# `idna`, whose `icu_*` crates require 1.88. Declaring a lower MSRV produced a confusing
# toolchain error instead of a clear one.
rust-version = "1.88"
description = "Native CLI client for a running Klardrop daemon (loopback control plane)"
# The repository ships a single Apache-2.0 LICENSE at its root and every other
# component in it is under that licence; a new subdirectory does not get its own.
license = "Apache-2.0"
publish = false

[[bin]]
name = "klardrop"
path = "src/main.rs"

# Test fixture only: a fake daemon used by tests/cli_contract.rs. Never shipped
# as a user-facing binary.
[[bin]]
name = "klardrop-fixture-daemon"
path = "src/bin/klardrop-fixture-daemon.rs"

[dependencies]
# No `color` feature: clap must never emit ANSI that could contaminate stdout.
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Loopback-only plain HTTP: no TLS, no gzip, no async runtime.
ureq = { version = "2", default-features = false }
# Terminal UI. Ratatui is pulled in with its crossterm backend only — no other
# backend is compiled — and crossterm is the single owner of raw mode, the
# alternate screen and input decoding. A second input source would be a bug.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
# A terminal cell is a *column*, not a character: a CJK glyph or an emoji is
# one `char` and two columns, so anything that budgets a name in `char`s
# overflows the row it was measured for. Already in the tree through ratatui;
# named here because the crate measures with it directly.
unicode-width = "0.2"

# Unix only, and only for `signal(2)`: an interrupted `share --wait` has to
# leave the caller holding the request id instead of dying silently. Already in
# the dependency graph through crossterm/ureq, so this adds no new package.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows only, and only for `SetConsoleCtrlHandler`: the console equivalent of
# the `signal(2)` handler above, so Ctrl-C during `share --wait` leaves the
# caller holding the request id instead of killing the client. The pinned
# version is already in Cargo.lock (errno, mio and rustix reference it), so
# this introduces no new package version — but this crate is its only consumer
# in the Windows build graph, so it is a real normal dependency there. The
# Linux graph is unchanged: `cargo tree -e normal --target
# x86_64-unknown-linux-gnu` does not list it at all.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[profile.release]
strip = true

[dev-dependencies]
# The TUI flow tests drive the real binary on a pseudo terminal and read the
# screen back, because a TUI's contract is what it puts on the screen. Neither
# crate reaches the shipped client: `cargo tree -e normal` must never list
# them.
portable-pty = "0.8"
vt100 = "0.15"

# `kill(2)` so the interrupted-wait test can send a real SIGINT. `Child::kill`
# is SIGKILL, which would test the default disposition instead of the handler.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# `GenerateConsoleCtrlEvent` and `CREATE_NEW_PROCESS_GROUP` so the Windows
# interrupted-wait test can aim a console event at one owned child. Ctrl-C is
# broadcast to every process on the console and is switched off for a new
# process group, so a single-process test has to send Ctrl-Break instead —
# which is exactly why the client answers both events.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
