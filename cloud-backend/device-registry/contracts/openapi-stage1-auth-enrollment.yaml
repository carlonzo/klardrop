openapi: 3.0.3
info:
  title: Klardrop Cloud Device Registry - Auth, Enrollment & Broker API
  version: 0.2.0
  description: |
    Two listener surfaces:
      * Public API (`/v1/...`)        — bearer JWT (session token) auth.
      * Internal API (`/v1/internal/...`) — bearer shared-secret; consumed by
        the MQTT broker only. Must NOT be exposed to the public internet.
servers:
  - url: https://api.klardrop.example.com
paths:
  /v1/auth/session/exchange:
    post:
      summary: Exchange OIDC (Auth0/Keycloak/...) ID token for Klardrop session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
      responses:
        '200':
          description: Session issued
  /v1/users/bootstrap:
    post:
      summary: Create private user scope and defaults if missing
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User scope ready
  /v1/devices/pairing-codes:
    post:
      summary: Issue one-time pairing code (requires 2FA gate)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secondFactorToken:
                  type: string
                approvedChallengeId:
                  type: string
                  nullable: true
              oneOf:
                - required: [secondFactorToken]
                - required: [approvedChallengeId]
      responses:
        '201':
          description: Pairing code issued
  /v1/devices/enroll:
    post:
      summary: Enroll new device and issue broker credential
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairingCode, deviceName, platform, devicePublicKey]
              properties:
                pairingCode:
                  type: string
                deviceName:
                  type: string
                platform:
                  type: string
                  enum: [android, ios, macos, windows, linux, web]
                devicePublicKey:
                  type: string
      responses:
        '201':
          description: Device enrolled
  /v1/devices/{deviceId}/revoke:
    post:
      summary: Revoke device, disconnect active MQTT session, and block reconnect
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Revocation accepted
  /v1/users/{userId}/devices:
    get:
      summary: List devices in the user's private scope
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device list
  /v1/devices/{deviceId}/rotate:
    post:
      summary: Rotate broker credential for a trusted device
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential rotated
  /v1/devices/approval-challenges:
    post:
      summary: Create trusted-device approval challenge for enrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requesterDeviceId]
              properties:
                requesterDeviceId:
                  type: string
      responses:
        '201':
          description: Challenge created
  /v1/devices/approval-challenges/{challengeId}/approve:
    post:
      summary: Approve enrollment challenge from trusted device context
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: challengeId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Challenge approval result
  /v1/devices/me/broker-token:
    post:
      summary: Refresh the short-lived MQTT broker JWT for a trusted device
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId:
                  type: string
      responses:
        '200':
          description: New broker token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId: { type: string }
                  brokerToken: { type: string }
                  brokerTokenExpiresAt: { type: integer, format: int64 }
                  brokerTokenTtlSeconds: { type: integer, format: int64 }
  /v1/internal/broker/auth/user:
    post:
      summary: Mosquitto authn webhook — validate device on CONNECT
      description: |
        Called by mosquitto-go-auth's HTTP backend on every MQTT CONNECT.
        Authenticated by `Authorization: Bearer ${INTERNAL_SHARED_SECRET}`.

        Body is `application/x-www-form-urlencoded` per mosquitto-go-auth's
        contract:
          - `username`  (ignored — JWT is the source of truth)
          - `password`  (broker JWT issued by /v1/devices/me/broker-token)
          - `clientid`  (must equal klardrop_<userId>_<deviceId>)

        Response is HTTP-status only (`auth_opt_http_response_mode = status`):
          - 200 → allow
          - 403 → deny (with plain-text reason in the body)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [password]
              properties:
                username: { type: string }
                password: { type: string }
                clientid: { type: string }
      responses:
        '200':
          description: Authentication allowed
        '403':
          description: Authentication denied (invalid token / revoked / clientId mismatch)
        '401':
          description: Internal shared-secret missing or wrong
        '503':
          description: Internal auth not configured on this deployment
  /v1/internal/broker/auth/acl:
    post:
      summary: Mosquitto ACL webhook — validate publish/subscribe topic
      description: |
        Called by mosquitto-go-auth's HTTP backend on every PUBLISH and
        SUBSCRIBE not covered by the in-broker cache (TTL 20s).

        Body fields per mosquitto-go-auth:
          - `clientid`  (encodes user_id + device_id)
          - `username`  (ignored)
          - `topic`
          - `acc`       (1 = read, 2 = write, 4 = subscribe)

        Response is HTTP-status only.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [clientid, topic, acc]
              properties:
                clientid: { type: string }
                username: { type: string }
                topic:    { type: string }
                acc:      { type: integer, enum: [1, 2, 4] }
      responses:
        '200':
          description: ACL allowed
        '403':
          description: ACL denied (revoked / outside user scope / not in role's allowed set)
        '400':
          description: Missing clientid/topic/acc
        '401':
          description: Internal shared-secret missing or wrong
  /v1/internal/broker/auth/superuser:
    post:
      summary: Mosquitto superuser check — always denies
      description: |
        Klardrop has no superusers. Always returns 403 — present so
        mosquitto-go-auth's superuser probe doesn't 404.
      responses:
        '403':
          description: No superusers
        '401':
          description: Internal shared-secret missing or wrong
  /v1/transfers/route-decision:
    post:
      summary: Decide local vs cloud transfer route
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiverReachableLocally]
              properties:
                receiverReachableLocally:
                  type: boolean
      responses:
        '200':
          description: Route decision
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
