openapi: 3.0.3
info:
  title: Klardrop Cloud Device Registry - Auth, Enrollment & Broker API
  version: 0.2.0
  description: |
    Two listener surfaces:
      * Public API (`/v1/...`)        — bearer JWT (session token) auth.
      * Internal API (`/v1/internal/...`) — bearer shared-secret; consumed by
        the MQTT broker only. Must NOT be exposed to the public internet.
servers:
  - url: https://api.klardrop.example.com
paths:
  /v1/auth/session/exchange:
    post:
      summary: Exchange OIDC (Auth0/Keycloak/...) ID token for Klardrop session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
      responses:
        '200':
          description: Session issued
  /v1/users/bootstrap:
    post:
      summary: Create private user scope and defaults if missing
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User scope ready
  /v1/devices/pairing-codes:
    post:
      summary: Issue one-time pairing code (requires 2FA gate)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secondFactorToken:
                  type: string
                approvedChallengeId:
                  type: string
                  nullable: true
              oneOf:
                - required: [secondFactorToken]
                - required: [approvedChallengeId]
      responses:
        '201':
          description: Pairing code issued
  /v1/devices/enroll:
    post:
      summary: Enroll new device and issue broker credential
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairingCode, deviceName, platform, devicePublicKey]
              properties:
                pairingCode:
                  type: string
                deviceName:
                  type: string
                platform:
                  type: string
                  enum: [android, ios, macos, windows, linux, web]
                devicePublicKey:
                  type: string
      responses:
        '201':
          description: Device enrolled
  /v1/devices/{deviceId}/revoke:
    post:
      summary: Revoke device, disconnect active MQTT session, and block reconnect
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Revocation accepted
  /v1/users/{userId}/devices:
    get:
      summary: List devices in the user's private scope
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device list
  /v1/devices/{deviceId}/rotate:
    post:
      summary: Rotate broker credential for a trusted device
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential rotated
  /v1/devices/approval-challenges:
    post:
      summary: Create trusted-device approval challenge for enrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requesterDeviceId]
              properties:
                requesterDeviceId:
                  type: string
      responses:
        '201':
          description: Challenge created
  /v1/devices/approval-challenges/{challengeId}/approve:
    post:
      summary: Approve enrollment challenge from trusted device context
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: challengeId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Challenge approval result
  /v1/devices/me/broker-token:
    post:
      summary: Refresh the short-lived MQTT broker JWT for a trusted device
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId:
                  type: string
      responses:
        '200':
          description: New broker token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId: { type: string }
                  brokerToken: { type: string }
                  brokerTokenExpiresAt: { type: integer, format: int64 }
                  brokerTokenTtlSeconds: { type: integer, format: int64 }
  /v1/internal/broker/auth:
    post:
      summary: MQTT broker authn + authz webhook (internal listener only)
      description: |
        Called by the EMQX HTTP authentication and HTTP authorization sources
        on every CONNECT (and cached for the JWT lifetime). Returns the topic
        ACL for the user's private subtree, or denies if the broker JWT is
        invalid / the device is revoked / clientId doesn't match.

        Authenticated by `Authorization: Bearer ${INTERNAL_SHARED_SECRET}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                username: { type: string, nullable: true, description: "MQTT username (unused)" }
                password: { type: string, description: "MQTT password = broker JWT" }
                clientId: { type: string, nullable: true, description: "MQTT clientId, must equal klardrop_<userId>_<deviceId>" }
      responses:
        '200':
          description: Allow or deny payload (HTTP 200 in both cases per EMQX contract)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [allow, deny, ignore] }
                  isSuperuser: { type: boolean }
                  userId: { type: string, nullable: true }
                  deviceId: { type: string, nullable: true }
                  publishAcl:
                    type: array
                    items: { type: string }
                  subscribeAcl:
                    type: array
                    items: { type: string }
                  expireAt: { type: integer, format: int64, nullable: true }
                  reason: { type: string, nullable: true }
        '401':
          description: Internal shared-secret missing or wrong
        '503':
          description: Internal auth not configured on this deployment
  /v1/transfers/route-decision:
    post:
      summary: Decide local vs cloud transfer route
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiverReachableLocally]
              properties:
                receiverReachableLocally:
                  type: boolean
      responses:
        '200':
          description: Route decision
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
