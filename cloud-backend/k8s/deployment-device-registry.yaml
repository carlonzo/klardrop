apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-registry
  namespace: klardrop
  labels:
    app: device-registry
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: device-registry
  template:
    metadata:
      labels:
        app: device-registry
        component: backend
    spec:
      containers:
      - name: device-registry
        image: klardrop/device-registry:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          name: http
        - containerPort: 9404
          name: metrics
        env:
        - name: SERVICE_NAME
          value: "device-registry"
        - name: PORT
          value: "8081"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: klardrop-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: klardrop-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: klardrop-secrets
              key: jwt-secret
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: klardrop-config
              key: kafka-bootstrap-servers
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: device-registry-config
---
apiVersion: v1
kind: Service
metadata:
  name: device-registry
  namespace: klardrop
  labels:
    app: device-registry
spec:
  selector:
    app: device-registry
  ports:
  - name: http
    port: 80
    targetPort: 8081
  - name: metrics
    port: 9404
    targetPort: 9404
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: device-registry-hpa
  namespace: klardrop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: device-registry
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80