# Self-hosted Klardrop cloud stack: device-registry + Mosquitto (with
# mosquitto-go-auth) + Keycloak + Postgres + Redis. Boots a complete control +
# data plane on a single machine for end-to-end exercise of the enrollment +
# MQTT flow.
#
# Prereqs: Docker Engine 24+, ~1.5 GB RAM, ports 1883/8081/8083/8883/9001/5432/6379 free.
#
# Usage:
#   cp .env.selfhost.example .env
#   docker compose -f docker-compose.selfhost.yml up -d
#   # Keycloak admin UI: http://localhost:8083  (kc-admin / kc-admin)
#   # Mosquitto:         tcp://localhost:1883   (TLS on 8883 in prod only)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: klardrop
      POSTGRES_USER: klardrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klardrop123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klardrop"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────────────────────
  # Identity provider — replaces Auth0 in the self-hosted topology.
  # First run will boot an empty Keycloak; create the `klardrop` realm and a
  # client with audience=klardrop-device-registry from the admin console.
  # ────────────────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-kc-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-kc-admin}
      KC_DB: dev-mem
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export:/opt/keycloak/data/import:ro
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep '200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ────────────────────────────────────────────────────────────────────────────
  # MQTT broker — Eclipse Mosquitto with the mosquitto-go-auth plugin (HTTP
  # backend pointed at device-registry).
  #
  # Image: iegomez/mosquitto-go-auth ships an upstream Mosquitto 2.x build with
  # the plugin compiled in. Apache 2.0 licence (Mosquitto is EPL/EDL).
  # ────────────────────────────────────────────────────────────────────────────
  mosquitto:
    image: iegomez/mosquitto-go-auth:latest
    volumes:
      - ./mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    ports:
      - "1883:1883"        # MQTT (plain — local dev only; use 8883 in prod)
      - "8883:8883"        # MQTT over TLS (mount certs in /mosquitto/certs)
      - "9001:9001"        # MQTT over WebSocket
    environment:
      # Templated into mosquitto.conf via envsubst at start; see image docs.
      DEVICE_REGISTRY_URL: http://device-registry:8081
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-internal-dev-secret}
    depends_on:
      device-registry:
        condition: service_started

  # ────────────────────────────────────────────────────────────────────────────
  # Klardrop device-registry — the control plane.
  # ────────────────────────────────────────────────────────────────────────────
  device-registry:
    build:
      context: ../device-registry
      dockerfile: ../docker/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/klardrop
      DATABASE_USER: klardrop
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-klardrop123}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-session-secret-change-me}
      JWT_ISSUER: klardrop-cloud
      JWT_AUDIENCE: klardrop-device-registry
      BROKER_JWT_SECRET: ${BROKER_JWT_SECRET:-dev-broker-secret-change-me}
      BROKER_JWT_AUDIENCE: klardrop-mqtt-broker
      BROKER_JWT_TTL_SECONDS: "900"
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_TOPIC_ROOT: klardrop/v1
      OIDC_ISSUER: http://keycloak:8080/realms/klardrop
      OIDC_AUDIENCE: klardrop-device-registry
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-internal-dev-secret}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
