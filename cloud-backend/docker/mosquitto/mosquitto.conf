# Mosquitto config for the self-host Klardrop stack.
# Drives mosquitto-go-auth's HTTP backend against the device-registry's
# /v1/internal/broker/auth/{user,acl,superuser} endpoints.
#
# auth_opt_acl_cache_seconds is intentionally short (20s) — combined with the
# Redis revoked-set checked on every authn/authz call, this is what gets us
# under the 30s revocation SLA without needing a broker REST kick API.

listener 1883
protocol mqtt
allow_anonymous false

# WebSocket listener for browser-based clients (future).
listener 9001
protocol websockets
allow_anonymous false

# TLS listener (production). Mount certs into /mosquitto/certs in prod.
# listener 8883
# protocol mqtt
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# ─── mosquitto-go-auth plugin ────────────────────────────────────────────────
auth_plugin /mosquitto/go-auth.so

auth_opt_backends http
auth_opt_check_prefix false

# Cache decisions briefly so we don't hammer device-registry on every PUBLISH.
# Tune in tandem with the revocation SLA: ttl + propagation must stay <= 30s.
auth_opt_cache true
auth_opt_auth_cache_seconds 20
auth_opt_acl_cache_seconds  20
auth_opt_auth_jitter_seconds 3
auth_opt_acl_jitter_seconds  3

# HTTP backend — JSON OFF (form-encoded), status-code response mode.
auth_opt_http_host device-registry
auth_opt_http_port 8081
auth_opt_http_getuser_uri    /api/v1/internal/broker/auth/user
auth_opt_http_aclcheck_uri   /api/v1/internal/broker/auth/acl
auth_opt_http_superuser_uri  /api/v1/internal/broker/auth/superuser
auth_opt_http_response_mode  status
auth_opt_http_method         POST
auth_opt_http_with_tls       false
auth_opt_http_retry_count    1

# Internal listener auth — bearer header sent on every webhook call. Must
# match INTERNAL_SHARED_SECRET set on the device-registry.
auth_opt_http_headers_list  Authorization
auth_opt_http_headers_authorization Bearer ${INTERNAL_SHARED_SECRET}
