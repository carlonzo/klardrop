[versions]
agp = "9.4.0"
# Capped at 2.4.10 by SKIE: 0.10.14 — the latest — supports Kotlin 2.0.0 through
# 2.4.10 and rejects anything newer at Gradle configuration time. Swift export gained
# sealed-class support in 2.4.20-RC, which covers the last SKIE feature we depend on,
# so the cap lifts once :presentation moves from the Obj-C export to swift-export.
# That migration needs direct integration (swift-export does not support CocoaPods),
# which is what the Sentry swap below unblocks.
kotlin = "2.4.10"
coroutines = "1.11.0"
serialization = "1.11.0"
jetbrains-compose = "1.12.0"
okio = "3.18.1"
ktor = "3.5.2"
datastore = "1.2.1"
androidx-activity = "1.13.0"
kotlinx-io = "0.9.1"
sentry-kmp = "0.27.0"
# Tracks the Sentry *Android Gradle* plugin, which is versioned independently of the
# KMP SDK above and must not be pinned to it.
sentry-android = "6.20.0"
filekit = "0.15.0"
composenativetray = "2.1.6"
sqldelight = "2.3.2"
cryptography = "0.6.0"
coil3 = "3.6.2"
# Linux BLE transport talks to BlueZ over D-Bus. 6.x (JDK 21 line) is announced but
# NOT yet released — Maven Central's latest is 5.2.0, which needs JDK 17+ and runs on 21.
dbus-java = "5.2.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
clikt = { module = "com.github.ajalt.clikt:clikt", version = "5.1.0" }

kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-core = { module = "androidx.core:core-ktx", version = "1.19.0" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

androidx-datastore-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
androidx-datastore-core-okio = { module = "androidx.datastore:datastore-core-okio", version.ref = "datastore" }

okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }

kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-io-okio = { module = "org.jetbrains.kotlinx:kotlinx-io-okio", version.ref = "kotlinx-io" }



jmdns = { module = "org.jmdns:jmdns", version = "3.6.3" }
dbus-java-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbus-java" }
dbus-java-transport-native-unixsocket = { module = "com.github.hypfvieh:dbus-java-transport-native-unixsocket", version.ref = "dbus-java" }
jna = { module = "net.java.dev.jna:jna", version = "5.19.1" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version = "5.19.1" }
ukey2 = { module = "com.carlonzo.ukey2:ukey2-kmp", version = "1.0" }
turbine = { module = "app.cash.turbine:turbine", version = "1.2.1" }
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
nucleus-composenativetray = { module = "dev.nucleusframework:composenativetray", version.ref = "composenativetray" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }

cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-provider-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptography" }
cryptography-random = { module = "dev.whyoleg.cryptography:cryptography-random", version.ref = "cryptography" }

coil3-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }

junit4 = { module = "junit:junit", version = "4.13.2" }
androidx-test-core = { module = "androidx.test:core-ktx", version = "1.7.0" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit-ktx", version = "1.3.0" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "jetbrains-compose" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "jetbrains-compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Installs the Sentry KMP SDK into commonMain and wires the sentry-cocoa framework
# into the Apple targets. Replaces Bugsnag, whose KMP SDK has no macOS artifact and
# so forced macosMain to import the CocoaPods-generated `cocoapods.Bugsnag` cinterop.
sentry-kmp = { id = "io.sentry.kotlin.multiplatform.gradle", version.ref = "sentry-kmp" }

# Uploads the R8 mapping to Sentry so release Android stack traces deobfuscate. The
# KMP plugin above only installs the SDK; nothing in it knows about the Android build,
# and this is the piece that replaces com.bugsnag.android.gradle. Deliberately on 6.x:
# AGP 9 support for the mapping upload landed in 5.12.2, and we are on AGP 9.3.1.
sentry-android = { id = "io.sentry.android.gradle", version.ref = "sentry-android" }

squareup-wire = { id = "com.squareup.wire", version = "6.4.7" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
