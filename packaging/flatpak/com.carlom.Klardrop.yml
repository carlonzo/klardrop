# Flatpak manifest for Klardrop.
#
# This is a TEMPLATE. The release workflow renders @VERSION@ (the X.Y.Z from the
# git tag vX.Y.Z) and @SHA256@ (the published tarball's checksum) before building,
# mirroring the placeholder convention used in packaging/aur/PKGBUILD.
#
# The release tarball is a self-contained jpackage app-image that bundles its own
# JRE plus the Skiko/AWT native libraries. There is therefore NO compile/build step
# here — the manifest just unpacks the tarball and installs files into /app, relying
# on the Freedesktop runtime to provide gtk3/fontconfig/GL/etc. at runtime.
#
# Build & test locally (after substituting the two placeholders by hand and pointing
# the source at a real release tarball + its sha256):
#
#   flatpak install -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
#   flatpak-builder --force-clean --install-deps-from=flathub \
#       --repo=repo build-dir packaging/flatpak/com.carlom.Klardrop.yml
#   flatpak-builder --run build-dir packaging/flatpak/com.carlom.Klardrop.yml klardrop
#
# Or install into the user remote to test the full desktop integration:
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/com.carlom.Klardrop.yml
#   flatpak run com.carlom.Klardrop

id: com.carlom.Klardrop

# Freedesktop runtime 25.08 — current stable branch (released Aug 2025, ~2-year
# support window). Chosen over 24.08 (released Aug 2024) because 24.08 is close to
# end-of-life, while 25.08 gives the longest support runway. It ships gtk3,
# fontconfig and the GL stack the bundled Skiko/AWT runtime needs.
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

# Launcher wrapper installed to /app/bin/klardrop (see build-commands).
command: klardrop

finish-args:
  # Native Wayland display when available...
  - --socket=wayland
  # ...with an X11 fallback for non-Wayland sessions (AWT/Skiko run under XWayland).
  - --socket=fallback-x11
  # AWT/Skiko need direct rendering for hardware-accelerated GL/compositing.
  - --device=dri
  # mDNS device discovery + raw TCP transfers happen on the local network.
  # Flatpak has no finer-grained "LAN only" permission, so full network access is
  # required for the core sharing feature.
  - --share=network
  # Reading/writing the files the user picks for sharing goes through the file-chooser
  # portal (xdg-desktop-portal), which grants per-file access at selection time — so
  # no broad --filesystem=home is needed. We DON'T add a static filesystem override
  # here; portals are preferred and keep the sandbox tight. (The .desktop Exec passes
  # %F so files dragged/opened onto the launcher are handed in via the document portal.)
  # Clipboard text sharing: clipboard access is mediated by the Wayland/X11 socket
  # above (and the portal), so no extra permission arg is required.

modules:
  - name: klardrop
    buildsystem: simple
    sources:
      # Self-contained universal Linux tarball published by the release pipeline.
      # CI substitutes the matching checksum into @SHA256@.
      - type: archive
        url: https://github.com/carlonzo/klardrop/releases/download/v@VERSION@/klardrop-linux-x64.tar.gz
        sha256: '@SHA256@'
    build-commands:
      # The archive's top-level dir (klardrop-linux-x64/) is stripped by flatpak-builder,
      # so paths below are relative to the tarball's contents.

      # 1. App-image (bin/klardrop launcher + lib/ with bundled JRE under lib/runtime/)
      #    goes to /app/klardrop. jpackage images are relocatable as long as the
      #    bin/lib structure is preserved.
      - cp -r klardrop /app/klardrop

      # 2. Launcher wrapper on PATH so `command: klardrop` resolves. It execs the real
      #    jpackage launcher, forwarding any args (e.g. file paths from the portal).
      - install -d /app/bin
      - |
        cat > /app/bin/klardrop <<'EOF'
        #!/bin/sh
        exec /app/klardrop/bin/klardrop "$@"
        EOF
      - chmod +x /app/bin/klardrop

      # 3. Desktop entry. Flatpak requires the desktop-file basename to equal the app id,
      #    so klardrop.desktop is renamed to com.carlom.Klardrop.desktop. The Icon= key
      #    must also reference the (renamed) icon basename = app id.
      - install -d /app/share/applications
      - install -Dm644 klardrop.desktop /app/share/applications/com.carlom.Klardrop.desktop
      - sed -i 's/^Icon=klardrop$/Icon=com.carlom.Klardrop/' /app/share/applications/com.carlom.Klardrop.desktop

      # 4. AppStream metadata. The metainfo basename must equal the app id, and its
      #    <launchable> must point at the renamed desktop id.
      - install -d /app/share/metainfo
      - install -Dm644 com.carlom.Klardrop.metainfo.xml /app/share/metainfo/com.carlom.Klardrop.metainfo.xml
      - sed -i 's|<launchable type="desktop-id">klardrop.desktop</launchable>|<launchable type="desktop-id">com.carlom.Klardrop.desktop</launchable>|' /app/share/metainfo/com.carlom.Klardrop.metainfo.xml

      # 5. Hicolor icons. Each icons/<size>/klardrop.png is renamed to
      #    com.carlom.Klardrop.png under the matching size dir (basename = app id).
      - install -Dm644 icons/32x32/klardrop.png   /app/share/icons/hicolor/32x32/apps/com.carlom.Klardrop.png
      - install -Dm644 icons/64x64/klardrop.png   /app/share/icons/hicolor/64x64/apps/com.carlom.Klardrop.png
      - install -Dm644 icons/128x128/klardrop.png /app/share/icons/hicolor/128x128/apps/com.carlom.Klardrop.png
      - install -Dm644 icons/256x256/klardrop.png /app/share/icons/hicolor/256x256/apps/com.carlom.Klardrop.png
      - install -Dm644 icons/512x512/klardrop.png /app/share/icons/hicolor/512x512/apps/com.carlom.Klardrop.png
