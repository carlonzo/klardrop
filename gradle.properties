org.gradle.jvmargs=-Xms500m -Xmx8g
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
android.defaults.buildfeatures.dataBinding=false
android.defaults.buildfeatures.renderScript=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# Required: the `spawn` cinterop is defined on the linux target compilations but its
# generated types are imported in the `linuxMain` intermediate source set (Exec.kt).
# Without this flag Kotlin/Native does not expose cinterop stubs to intermediate source
# sets, causing unresolved-reference errors on the posix.spawn.* imports.
kotlin.mpp.enableCInteropCommonization=true
