name: Release (nightly)

# Tester-track releases, separate from the production `Release` workflow (which is
# tag-driven and ships to Play production / App Store / Homebrew). This one runs on a
# schedule (and on manual dispatch) and publishes to TESTER channels only:
#   - iOS     → TestFlight
#   - Android → Google Play `beta` (Open testing) track
#   - macOS   → rolling GitHub *prerelease* (DMG)
#   - Linux   → rolling GitHub *prerelease* (universal tarball)
#
# A moving `nightly` git tag marks the commit of the last fully-successful nightly.
# The `gate` job aborts the whole run when no commits have landed since that tag
# (manual dispatch can override with `force: true`). The tag is only advanced by the
# final `publish` job, so a failed nightly is retried on the next run.

on:
  schedule:
    - cron: '0 4 * * *'   # daily, 04:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if no new commits since the last nightly'
        type: boolean
        default: false

permissions:
  contents: write   # publish the prerelease + move the `nightly` tag

jobs:
  # Abort unless there are new commits since the last nightly. Also derives the
  # nightly version (see the `v` step): versionName = UTC date, versionCode =
  # commits*2 + 1 — the same monotonic integer the stable workflow uses, on the odd
  # (tester) side so it never collides with a stable build of the same commit.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed:     ${{ steps.check.outputs.proceed }}
      semver:      ${{ steps.v.outputs.semver }}
      base:        ${{ steps.v.outputs.base }}
      versionCode: ${{ steps.v.outputs.versionCode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Manual force run — skipping the new-commits check."
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git rev-parse -q --verify refs/tags/nightly >/dev/null; then
            echo "No previous 'nightly' tag — first nightly. Proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          COUNT="$(git rev-list nightly..HEAD --count)"
          echo "$COUNT commit(s) since the last nightly ($(git rev-parse --short nightly))."
          if [ "$COUNT" -eq 0 ]; then
            echo "::notice::No new commits since the last nightly — nothing to release."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - id: v
        if: steps.check.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # One identifier drives everything — the commit count — so nightly and stable
          # stay consistent (no dates; the stable workflow's versionCode is commit-based too).
          #   base   = next patch above the latest stable tag (1.0.0 before the first release).
          #            A nightly AFTER a stable must target the NEXT version, else its
          #            pre-release semver would sort BELOW the stable it follows.
          #   semver = <base>-nightly.<commits> — Android versionName + GitHub release title.
          #            Per semver: last-stable < <base>-nightly.N < <base>, so reading it
          #            tells you it's after the current stable and before the next release.
          #   iOS CFBundleShortVersionString + desktop jpackage packageVersion can't carry a
          #   pre-release suffix, so they use the numeric <base>; the build number keeps order.
          #   versionCode = commits*2 + 1 (stable uses commits*2 — even vs odd never collide,
          #   and the +1 supersedes the stable rebuilt from the same commit on tester tracks).
          COMMITS="$(git rev-list --count HEAD)"
          LAST="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -z "$LAST" ]; then
            BASE="1.0.0"
          else
            core="${LAST#v}"; IFS='.' read -r MA MI PA <<< "$core"
            BASE="${MA}.${MI}.$((PA + 1))"
          fi
          SEMVER="${BASE}-nightly.${COMMITS}"
          CODE=$(( COMMITS * 2 + 1 ))
          echo "base=$BASE"        >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER"    >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "Nightly semver=$SEMVER base=$BASE versionCode=$CODE commits=$COMMITS (last stable: ${LAST:-none})"

  # Android AAB → Play `beta` (Open testing) track. versionName carries the full pre-release
  # semver (Android allows any string); versionCode is the integer ordering.
  android:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      # packageVersion (numeric base) is set even though this job only builds the AAB:
      # Gradle configures :desktop too, and Compose validates the jpackage version at
      # configuration time — the suffixed semver alone makes that fail ("Illegal version
      # for 'Dmg'").
      GRADLE_VERSION_ARGS: >-
        -Pklardrop.version=${{ needs.gate.outputs.semver }}
        -Pklardrop.packageVersion=${{ needs.gate.outputs.base }}
        -Pklardrop.versionCode=${{ needs.gate.outputs.versionCode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@v6

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 — AAB will be debug-signed and Play upload will be skipped."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/klardrop-upload.jks"
          {
            echo "KLARDROP_KEYSTORE_FILE=$RUNNER_TEMP/klardrop-upload.jks"
            echo "KLARDROP_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KLARDROP_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KLARDROP_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build AAB
        run: ./gradlew :android:bundleRelease $GRADLE_VERSION_ARGS

      - name: Detect Play service-account secret
        id: play
        shell: bash
        run: |
          if [ -z "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON absent — skipping Play upload."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Open testing track. `status: completed` creates the track release AND rolls it
      # out to 100% of open testers — without it the AAB only lands in the bundle
      # explorer with no release attached. `beta` is the Play API id for the Open
      # testing track (alpha = closed, internal = internal); change it here if you
      # publish to a custom-named testing track instead.
      - name: Upload to Google Play (open testing track)
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.carlom.klardrop
          releaseFiles: android/build/outputs/bundle/release/*.aab
          track: beta
          status: completed

  # iOS/iPad archive → TestFlight (same automatic-signing flow the production iOS
  # path would use). macos-26 + latest-stable Xcode matches build_pr.yml's toolchain.
  ios:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: macos-26
    env:
      GRADLE_VERSION_ARGS: >-
        -Pklardrop.version=${{ needs.gate.outputs.base }}
        -Pklardrop.versionCode=${{ needs.gate.outputs.versionCode }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect Apple signing secrets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}" ] || [ -z "${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}" ]; then
            echo "Apple distribution cert / API key absent — skipping TestFlight upload."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select latest stable Xcode
        if: steps.signing.outputs.enabled == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # JDK 21 is REQUIRED — the Kotlin pod syncFramework script phase (run by
      # xcodebuild during archive) is pinned to JDK 21.
      - uses: actions/setup-java@v5
        if: steps.signing.outputs.enabled == 'true'
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.signing.outputs.enabled == 'true'

      # ~/.konan (Kotlin/Native compiler + Apple platform libs) lives outside the
      # Gradle home setup-gradle caches, so cache it explicitly — skips the ~1GB
      # download per run. Keyed on the version catalog (Kotlin/konan version).
      - name: Cache Kotlin/Native (~/.konan)
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/dependencies.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # iOS pulls Bugsnag through CocoaPods directly (unlike macOS, which needs the
      # synthetic Release framework prebuilt), so only the dummy framework + pod
      # install are needed before xcodebuild — mirrors build_pr.yml's iOS build.
      - name: Prebuild Kotlin framework + pod install
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          ./gradlew :presentation:generateDummyFramework $GRADLE_VERSION_ARGS
          pod install --project-directory=iosApp

      - name: Import Apple Distribution cert
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12:    ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PW: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain"
          KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC"

      - name: Write App Store Connect API key
        if: steps.signing.outputs.enabled == 'true'
        env:
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$API_KEY_P8" | base64 -d > "$RUNNER_TEMP/keys/AuthKey_${API_KEY_ID}.p8"

      # Automatic signing (-allowProvisioningUpdates + the API key) lets Xcode create
      # the App Store provisioning profiles for the app + share extension on the fly.
      # exportArchive with destination=upload ships straight to TestFlight.
      - name: Archive + upload to TestFlight
        if: steps.signing.outputs.enabled == 'true'
        env:
          TEAM_ID:    ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          VERSION:    ${{ needs.gate.outputs.base }}
          BUILD:      ${{ needs.gate.outputs.versionCode }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/Klardrop.xcarchive"
          KEY="$RUNNER_TEMP/keys/AuthKey_${API_KEY_ID}.p8"

          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>${TEAM_ID}</string>
          <key>destination</key><string>upload</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

  # Linux universal tarball (bundled JRE), uploaded as an artifact the `publish` job
  # attaches to the nightly prerelease. (No ProGuard smoke gate here — that runs on
  # the production release; nightly stays lean.)
  linux:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      # version = pre-release semver → KlardropVersion.VERSION (the app's displayed +
      # updater version, so it compares correctly against the nightly latest.json).
      # packageVersion = numeric base → jpackage (which rejects the -nightly suffix).
      # updateChannel = nightly → the app polls the nightly latest.json and self-updates
      # to newer nightlies instead of the stable release.
      GRADLE_VERSION_ARGS: >-
        -Pklardrop.version=${{ needs.gate.outputs.semver }}
        -Pklardrop.packageVersion=${{ needs.gate.outputs.base }}
        -Pklardrop.versionCode=${{ needs.gate.outputs.versionCode }}
        -Pklardrop.updateChannel=nightly
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build Linux app-image
        run: ./gradlew :desktop:createReleaseDistributable $GRADLE_VERSION_ARGS

      - name: Stage Linux universal tarball
        shell: bash
        run: |
          set -euo pipefail
          APPDIR=desktop/build/compose/binaries/main-release/app
          STAGE=stage/klardrop-linux-x64
          rm -rf stage && mkdir -p "$STAGE/icons"
          cp -r "$APPDIR/klardrop" "$STAGE/klardrop"
          cp packaging/linux/klardrop.desktop "$STAGE/"
          cp packaging/linux/com.carlom.Klardrop.metainfo.xml "$STAGE/"
          for s in 32 64 128 256 512; do
            mkdir -p "$STAGE/icons/${s}x${s}"
            cp "brand/klardrop-icon-${s}.png" "$STAGE/icons/${s}x${s}/klardrop.png"
          done
          mkdir -p "$STAGE/icons/scalable"
          cp brand/klardrop-icon.svg "$STAGE/icons/scalable/klardrop.svg"
          mkdir -p dist
          tar -czf dist/klardrop-linux-x64.tar.gz -C stage klardrop-linux-x64
          rm -rf stage
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-linux
          path: dist/*
          if-no-files-found: error

  # Native macOS DMG. Signed + notarized when the Apple secrets are present (same
  # flow as the production build), otherwise an unsigned DMG for testers.
  macos:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: macos-latest
    env:
      GRADLE_VERSION_ARGS: >-
        -Pklardrop.version=${{ needs.gate.outputs.base }}
        -Pklardrop.versionCode=${{ needs.gate.outputs.versionCode }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v6

      # Cache ~/.konan (Kotlin/Native compiler + Apple platform libs) — outside the
      # Gradle home setup-gradle caches. Keyed on the version catalog.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/dependencies.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Build Kotlin macOS frameworks (Bugsnag synthetic + dummy)
        run: ./gradlew :klardrop-common:podBuildBugsnagMacos :presentation:generateDummyFramework $GRADLE_VERSION_ARGS

      - name: pod install
        run: pod install --project-directory=iosApp

      - name: Detect Apple signing secrets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}" ] || [ -z "${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}" ]; then
            echo "Apple signing/notarization secrets absent — building UNSIGNED .dmg."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID cert (signed builds only)
        if: steps.signing.outputs.signed == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain"
          KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC"

      - name: Archive KlardropMac
        env:
          VERSION: ${{ needs.gate.outputs.base }}
          BUILD:   ${{ needs.gate.outputs.versionCode }}
        run: |
          set -euo pipefail
          # Archive WITHOUT signing. Signing for signed builds happens in the export step
          # below (method=developer-id, automatic) — that's also where Xcode fetches the
          # Developer ID provisioning profile carrying keychain-access-groups.
          # Mixing CODE_SIGN_STYLE=Automatic with a manual CODE_SIGN_IDENTITY override is a
          # hard "conflicting provisioning settings" error on every target, so we never sign here.
          # arm64-only: the Kotlin presentation.framework is built for the runner's
          # arch (Apple Silicon), so a universal (arm64+x86_64) archive fails with
          # "could not find module 'presentation' for target 'x86_64-apple-macos'".
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace -scheme KlardropMac \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/KlardropMac.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD"

      - name: Export signed .app (signed builds only)
        if: steps.signing.outputs.signed == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          TEAM_ID:    ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$API_KEY_P8" | base64 -d > "$RUNNER_TEMP/keys/AuthKey.p8"
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict>
          </plist>
          EOF
          # -allowProvisioningUpdates + API key lets Xcode fetch/create the Developer ID
          # profile and re-sign the app, nested frameworks and the share extension with the
          # Developer ID Application cert imported into the keychain.
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KlardropMac.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

          # -exportArchive (developer-id) signs the executables WITHOUT --options runtime, so
          # notarization rejects them: "The executable does not have the hardened runtime enabled"
          # (Klardrop + KlardropMacShare.appex). Re-sign inside-out WITH hardened runtime.
          #
          # exportArchive emits an empty entitlements set (the Developer ID profile carries none),
          # so re-signing from the post-export signature drops app-sandbox, app-groups, network,
          # etc. A share extension MUST stay sandboxed or the host app won't even launch
          # (RunningBoard "Launchd job spawn failed", POSIX 163). Re-sign each bundle from its repo
          # .entitlements instead, expanding $(AppIdentifierPrefix) -> TEAMID. so no Xcode variable
          # leaks in. This also restores the team-prefixed keychain-access-groups (without it the
          # data-protection keychain fails with errSecMissingEntitlement and macOS pops a "enter
          # your keychain password" dialog on every signing op).
          APP="$RUNNER_TEMP/export/Klardrop.app"
          resign() {
            local bundle="$1" src="$2" ent
            ent="$(mktemp)"
            sed "s/\$(AppIdentifierPrefix)/${TEAM_ID}./g" "$src" > "$ent"
            codesign --force --options runtime --timestamp \
              --sign "Developer ID Application" --entitlements "$ent" "$bundle"
          }
          # extension first so the app's outer signature seals the re-signed extension
          resign "$APP/Contents/PlugIns/KlardropMacShare.appex" "iosApp/Klardrop Mac Share/KlardropMacShare.entitlements"
          resign "$APP" "iosApp/iosApp/KlardropMac.entitlements"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # don't ship a broken nightly: appex must stay sandboxed, app must keep its keychain group
          codesign -d --entitlements - --xml "$APP/Contents/PlugIns/KlardropMacShare.appex" 2>/dev/null \
            | grep -q "com.apple.security.app-sandbox" \
            || { echo "::error::app-sandbox missing from KlardropMacShare.appex"; exit 1; }
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q "${TEAM_ID}.com.carlom.Klardrop" \
            || { echo "::error::keychain-access-groups missing from signed Klardrop.app"; exit 1; }

      - name: Stage .app, notarize, build DMG
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          VERSION:    ${{ needs.gate.outputs.base }}
          SIGNED:     ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          if [ "$SIGNED" = "true" ]; then
            APP="$RUNNER_TEMP/export/Klardrop.app"
          else
            APP="$RUNNER_TEMP/KlardropMac.xcarchive/Products/Applications/Klardrop.app"
          fi
          cp -R "$APP" stage/

          if [ "$SIGNED" = "true" ]; then
            mkdir -p "$RUNNER_TEMP/keys"
            echo "$API_KEY_P8" | base64 -d > "$RUNNER_TEMP/keys/AuthKey.p8"
            AUTH=(--key "$RUNNER_TEMP/keys/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER")
            # Submit one file and fail on anything but Accepted. `submit --wait` exits 0 even when
            # the result is Invalid, so parse the status and, on failure, dump the notary log
            # (which names the offending files) before exiting.
            notarize() {
              local f="$1" out id status
              out="$(xcrun notarytool submit "$f" "${AUTH[@]}" --wait --output-format json)"
              echo "$out"
              id="$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
              status="$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
              if [ "$status" != "Accepted" ]; then
                echo "::error::Notarization $status for $f — see log below"
                xcrun notarytool log "$id" "${AUTH[@]}" || true
                exit 1
              fi
            }

            # Notarize + staple the .app FIRST so the notarization ticket is embedded in the
            # bundle. Homebrew copies Klardrop.app OUT of the DMG into /Applications, where the
            # DMG's own staple is unreachable; without an app-level ticket Gatekeeper falls back
            # to an online notarization lookup, which fails offline / behind firewalls and shows
            # "Apple could not verify Klardrop is free of malware" on first launch. Stapling the
            # app lets Gatekeeper validate it with no network.
            ditto -c -k --keepParent stage/Klardrop.app "$RUNNER_TEMP/Klardrop.app.zip"
            notarize "$RUNNER_TEMP/Klardrop.app.zip"
            xcrun stapler staple stage/Klardrop.app
          fi

          ln -s /Applications stage/Applications
          hdiutil create -volname Klardrop -srcfolder stage -ov -format UDZO \
            "dist/klardrop-${VERSION}.dmg"

          # Notarize + staple the DMG too, so a direct .dmg download is trusted on first open.
          if [ "$SIGNED" = "true" ]; then
            notarize "dist/klardrop-${VERSION}.dmg"
            xcrun stapler staple "dist/klardrop-${VERSION}.dmg"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-macos
          path: dist/*
          if-no-files-found: error

  # Collect the desktop artifacts and (re)publish the rolling `nightly` prerelease.
  # Runs only when every build job succeeded, so a partial failure leaves the tag in
  # place and the next run retries. prerelease:true keeps it off `releases/latest`, so
  # install.sh / Homebrew (which track the stable release) are unaffected.
  publish:
    needs: [gate, android, ios, linux, macos]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # latest.json (+ .sha256 sidecars) so the in-app updater on the nightly channel has
      # a manifest to poll. URLs point at the fixed `nightly` tag; version is the
      # pre-release semver so the comparator orders successive nightlies. Mirrors the
      # stable publish job, scoped to the assets the nightly produces (DMG + Linux tarball).
      - name: Generate checksums + nightly latest.json
        env:
          REPO:    ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.semver }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          for f in *; do
            if [ -f "$f" ] && [[ "$f" != *.sha256 ]] && [[ "$f" != "latest.json" ]]; then
              sha256sum "$f" | awk '{print $1}' > "$f.sha256"
            fi
          done
          pick() { ls $1 2>/dev/null | head -n1 || true; }
          DMG=$(pick "*.dmg")
          TGZ=$(pick "*.tar.gz")
          export BASE="https://github.com/${REPO}/releases/download/nightly"
          python3 - "$DMG" "$TGZ" <<'PY' > latest.json
          import json, os, sys, datetime, pathlib
          dmg, tgz = sys.argv[1:3]
          base = os.environ["BASE"]
          def entry(name):
              if not name: return None
              digest = pathlib.Path(name + ".sha256").read_text().strip()
              size   = pathlib.Path(name).stat().st_size
              return {"url": f"{base}/{name}", "sha256": digest, "size": size}
          platforms = {}
          if dmg: platforms["macos"]         = entry(dmg)
          if tgz: platforms["linux-tarball"] = entry(tgz)
          out = {
            "version":     os.environ["VERSION"],
            "tag":         "nightly",
            "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "notes":       f"https://github.com/{os.environ['REPO']}/releases/tag/nightly",
            "platforms":   platforms,
          }
          print(json.dumps(out, indent=2))
          PY
          cat latest.json

      # Delete the previous nightly release first, then recreate it from scratch below,
      # so only the latest nightly's binaries are ever stored (the version-stamped DMG
      # name changes whenever the base version bumps, so updating-in-place would otherwise
      # leave stale assets behind and grow GitHub storage without bound). The git tag is
      # kept (re-pointed in the next step) since the gate uses it as the commit marker.
      - name: Delete the previous nightly release (keep only the latest binaries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete nightly --repo "${{ github.repository }}" --yes || true

      - name: Advance the rolling `nightly` tag to this commit
        run: |
          set -euo pipefail
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin nightly

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Klardrop ${{ needs.gate.outputs.semver }}"
          body: "Automated nightly tester build ${{ needs.gate.outputs.semver }} (build ${{ needs.gate.outputs.versionCode }}). Not for production use."
          prerelease: true
          files: artifacts/*
          fail_on_unmatched_files: true

      # Bump the `klardrop-nightly` cask in the tap so testers can
      # `brew install --cask carlonzo/klardrop/klardrop-nightly` and `brew upgrade` to
      # each new build (cask version = full semver, so the version bump is what triggers
      # the upgrade — the rolling `nightly` url stays fixed). Separate token from the
      # stable `klardrop` cask. Non-fatal: the release is already published above.
      - name: Publish nightly Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION:   ${{ needs.gate.outputs.semver }}
          BASE:      ${{ needs.gate.outputs.base }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping nightly Homebrew publish."; exit 0
          fi
          DMG="klardrop-${BASE}.dmg"
          SHA="$(cat "artifacts/${DMG}.sha256")"
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA}/g" -e "s/@DMG@/${DMG}/g" \
            packaging/homebrew/klardrop-nightly.rb > klardrop-nightly.rb
          echo "--- rendered cask ---"; cat klardrop-nightly.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/carlonzo/homebrew-klardrop.git" tap
          mkdir -p tap/Casks
          cp klardrop-nightly.rb tap/Casks/klardrop-nightly.rb
          cd tap
          git config user.name "klardrop-ci"
          git config user.email "carlo.marinangeli@gmail.com"
          git add Casks/klardrop-nightly.rb
          git commit -m "klardrop-nightly ${VERSION}" || { echo "no cask change"; exit 0; }
          git push
