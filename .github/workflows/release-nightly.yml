name: Release (nightly)

# Tester-track releases, separate from the production `Release` workflow (which is
# tag-driven and ships to Play production / App Store / Homebrew). This one runs on a
# schedule (and on manual dispatch) and publishes to TESTER channels only:
#   - iOS     → TestFlight
#   - Android → Google Play `beta` (Open testing) track
#   - macOS   → rolling GitHub *prerelease* (DMG)
#   - Linux   → rolling GitHub *prerelease* (universal tarball)
#
# A moving `nightly` git tag marks the commit of the last ATTEMPTED nightly. The `gate`
# job aborts the whole run when no commits have landed since that tag (manual dispatch
# can override with `force: true`) and advances the tag as soon as it decides to proceed —
# BEFORE the builds run. This is deliberate: the nightly versionCode is derived from the
# commit count, so re-running the same commit rebuilds an identical AAB that Play rejects
# ("Version code N has already been used"). Advancing per-attempt means a failed nightly
# is NOT silently retried against the same commit on the next schedule — it waits for the
# next commit (typically the fix). Use `force: true` to re-run the same commit on purpose.

on:
  schedule:
    - cron: '0 4 * * *'   # daily, 04:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if no new commits since the last nightly'
        type: boolean
        default: false

permissions:
  contents: write   # publish the prerelease + move the `nightly` tag

jobs:
  # Abort unless there are new commits since the last nightly. Also derives the
  # nightly version (see the `v` step): versionName = UTC date, versionCode =
  # commits*2 + 1 — the same monotonic integer the stable workflow uses, on the odd
  # (tester) side so it never collides with a stable build of the same commit.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed:     ${{ steps.check.outputs.proceed }}
      semver:      ${{ steps.v.outputs.semver }}
      base:        ${{ steps.v.outputs.base }}
      versionCode: ${{ steps.v.outputs.versionCode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Manual force run — skipping the new-commits check."
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git rev-parse -q --verify refs/tags/nightly >/dev/null; then
            echo "No previous 'nightly' tag — first nightly. Proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          COUNT="$(git rev-list nightly..HEAD --count)"
          echo "$COUNT commit(s) since the last nightly ($(git rev-parse --short nightly))."
          if [ "$COUNT" -eq 0 ]; then
            echo "::notice::No new commits since the last nightly — nothing to release."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - id: v
        if: steps.check.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # One identifier drives everything — the commit count — so nightly and stable
          # stay consistent (no dates; the stable workflow's versionCode is commit-based too).
          #   base   = next patch above the latest stable tag (1.0.0 before the first release).
          #            A nightly AFTER a stable must target the NEXT version, else its
          #            pre-release semver would sort BELOW the stable it follows.
          #   semver = <base>-nightly.<commits> — Android versionName + GitHub release title.
          #            Per semver: last-stable < <base>-nightly.N < <base>, so reading it
          #            tells you it's after the current stable and before the next release.
          #   iOS CFBundleShortVersionString + desktop jpackage packageVersion can't carry a
          #   pre-release suffix, so they use the numeric <base>; the build number keeps order.
          #   versionCode = commits*2 + 1 (stable uses commits*2 — even vs odd never collide,
          #   and the +1 supersedes the stable rebuilt from the same commit on tester tracks).
          COMMITS="$(git rev-list --count HEAD)"
          LAST="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -z "$LAST" ]; then
            BASE="1.0.0"
          else
            core="${LAST#v}"; IFS='.' read -r MA MI PA <<< "$core"
            BASE="${MA}.${MI}.$((PA + 1))"
          fi
          SEMVER="${BASE}-nightly.${COMMITS}"
          CODE=$(( COMMITS * 2 + 1 ))
          echo "base=$BASE"        >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER"    >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "Nightly semver=$SEMVER base=$BASE versionCode=$CODE commits=$COMMITS (last stable: ${LAST:-none})"

      # Advance the `nightly` tag to this commit BEFORE the builds run, so a failed nightly
      # is not retried against the same commit on the next schedule (which would rebuild the
      # same commit-derived versionCode and be rejected by Play). The tag is the gate's
      # commit marker; on success `publish` recreates the GitHub release on top of it.
# Fail here, not after shipping. An unset secret interpolates to "" and every downstream
      # consumer treats empty as "disabled": initCrashReporter no-ops on an empty DSN, and the
      # Sentry jobs skip on an empty token. That is exactly right for pull requests and forks,
      # and exactly wrong here -- a nightly would build, sign, publish and go green while
      # every shipped binary had crash reporting compiled out. One assert up front beats
      # discovering it from an empty Sentry dashboard weeks later.
      # SENTRY_ORG / SENTRY_PROJECT are repository *variables*, not secrets, on purpose. They are
      # not sensitive -- both appear in every Sentry URL -- and storing them as secrets makes
      # Actions redact those literal strings from every log line in the repo, so `:klardrop-common:`
      # renders as `:***-common:` and Gradle paths become unreadable. Only the DSN and the auth
      # token are secrets.
      - name: Require Sentry configuration
        shell: bash
        env:
          SENTRY_DSN:        ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:        ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT:    ${{ vars.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          missing=""
          for v in SENTRY_DSN SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
            [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Sentry configuration:$missing — a nightly built without them"\
                 " ships with crash reporting disabled and unsymbolicated. Set them in"\
                 " Settings > Secrets and variables > Actions (DSN + auth token as secrets,"\
                 " org + project as variables), then re-run."
            exit 1
          fi

      - name: Advance the `nightly` tag to this commit
        if: steps.check.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin nightly

  # Nightlies get the same release lifecycle as a tagged release, and arguably need it more:
  # they ship to real testers (TestFlight + Play `beta` + the rolling prerelease) and the
  # commit range between two nightlies is a day, so Sentry's suspect-commit resolution
  # actually points at a single change instead of a whole release's worth of them.
  #
  # The release name is `semver` (1.0.1-nightly.<commits>). All four build jobs bake exactly
  # that into KlardropVersion.VERSION and therefore send it as `options.release`, so events
  # and release land on the same name. Keep it that way: ios/macos used to pass the bare
  # `base` here, which filed Apple nightly crashes under the *next stable* version — a release
  # belonging to the tagged pipeline, corrupted before it had shipped.
  sentry-release:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG:        ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT:    ${{ vars.SENTRY_PROJECT }}
      VERSION:           ${{ needs.gate.outputs.semver }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # `set-commits --auto` diffs against the previous release's commit

      - name: Create Sentry release + associate commits
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "SENTRY_AUTH_TOKEN not set — skipping Sentry release creation (fork or unconfigured repo)."
            exit 0
          fi

          # Pinned, and installed into a job-local dir. sentry-cli is not on the runner image,
          # but piping an unversioned installer into a shell is not acceptable in a pipeline
          # whose sibling jobs hold the Apple signing identity and the Play credentials.
          # INSTALL_DIR keeps it out of /usr/local/bin (no sudo, and no "already installed"
          # abort if a future runner image ships one).
          curl -fsSL https://sentry.io/get-cli/ \
            | INSTALL_DIR="$RUNNER_TEMP/sentry-cli" SENTRY_CLI_VERSION=3.6.2 bash
          export PATH="$RUNNER_TEMP/sentry-cli:$PATH"

          sentry-cli releases new "$VERSION"

          # --ignore-missing covers the first-ever release (no previous release to diff from);
          # the `||` covers the org having no repository integration configured. Commit
          # association is a nice-to-have — never a reason to fail the nightly.
          sentry-cli releases set-commits "$VERSION" --auto --ignore-missing \
            || echo "::warning::Could not associate commits with Sentry release $VERSION — continuing."

  # Android AAB → Play `beta` (Open testing) track. versionName carries the full pre-release
  # semver (Android allows any string); versionCode is the integer ordering.
  android:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      # packageVersion (numeric base) is set even though this job only builds the AAB:
      # Gradle configures :desktop too, and Compose validates the jpackage version at
      # configuration time — the suffixed semver alone makes that fail ("Illegal version
      # for 'Dmg'").
      GRADLE_VERSION_ARGS: >-
        -Pklardrop.version=${{ needs.gate.outputs.semver }}
        -Pklardrop.packageVersion=${{ needs.gate.outputs.base }}
        -Pklardrop.versionCode=${{ needs.gate.outputs.versionCode }}

      # Credentials for the Sentry Android Gradle plugin, which uploads the R8 mapping file
      # as part of :android:bundleRelease. Without them every Android stack trace in Sentry
      # stays obfuscated (a.b.c.d) — the same class of unreadable as an unsymbolicated Apple
      # crash, and the tester tracks this job feeds are exactly where those traces come from.
      # Same three variables scripts/upload_dsyms.sh consumes; empty on a fork, and
      # android/build.gradle.kts is responsible for making the upload optional in that case.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG:        ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT:    ${{ vars.SENTRY_PROJECT }}

      # Sentry DSN, baked in at compile time. Kept out of the tree because this repo is
      # public and a DSN is a write-only ingest endpoint — a committed one is free quota
      # for anyone scraping GitHub. Passed as ORG_GRADLE_PROJECT_* rather than a `-P` flag
      # because the Apple frameworks are built by xcodebuild running `syncFramework` from
      # the podspec script phase, which inherits the environment but not this job's Gradle
      # arguments. Absent from build_pr.yml on purpose: PR builds must not report.
      ORG_GRADLE_PROJECT_klardropSentryDsn: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@v6

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 — AAB will be debug-signed and Play upload will be skipped."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/klardrop-upload.jks"
          {
            echo "KLARDROP_KEYSTORE_FILE=$RUNNER_TEMP/klardrop-upload.jks"
            echo "KLARDROP_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KLARDROP_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KLARDROP_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build AAB
        run: ./gradlew :android:bundleRelease $GRADLE_VERSION_ARGS

      - name: Detect Play service-account secret
        id: play
        shell: bash
        run: |
          if [ -z "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON absent — skipping Play upload."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Open testing track. `status: completed` creates the track release AND rolls it
      # out to 100% of open testers — without it the AAB only lands in the bundle
      # explorer with no release attached. `beta` is the Play API id for the Open
      # testing track (alpha = closed, internal = internal); change it here if you
      # publish to a custom-named testing track instead.
      - name: Upload to Google Play (open testing track)
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.carlom.klardrop
          releaseFiles: android/build/outputs/bundle/release/*.aab
          track: beta
          status: completed

  # iOS/iPad archive → TestFlight (same automatic-signing flow the production iOS
  # path would use). macos-26 + latest-stable Xcode matches build_pr.yml's toolchain.
  ios:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: macos-26
    env:
      # `version` is the nightly semver (1.0.1-nightly.N) so KlardropVersion.VERSION -- and
      # therefore the Sentry release these crashes report against -- matches the android and
      # linux jobs. It used to be the bare `base`, which meant Apple nightly crashes landed on
      # the *future stable* 1.0.1 release, mixing tester crashes into a version that had not
      # shipped. `packageVersion` keeps the bare form for anything that needs a strictly
      # numeric x.y.z. Note the user-visible CFBundleShortVersionString is unaffected: the
      # nightly Apple artifacts come from xcodebuild + hdiutil, not jpackage, and take their
      # marketing version from MARKETING_VERSION on the xcodebuild line.
      GRADLE_VERSION_ARGS: >-
        -Pklardrop.version=${{ needs.gate.outputs.semver }}
        -Pklardrop.packageVersion=${{ needs.gate.outputs.base }}
        -Pklardrop.versionCode=${{ needs.gate.outputs.versionCode }}

      # Same version, exported the ORG_GRADLE_PROJECT_ way, for the same reason as the DSN
      # below: the Kotlin framework this job ships is built by xcodebuild running
      # `syncFramework` from the podspec script phase, which never sees $GRADLE_VERSION_ARGS.
      # Without it the framework embeds KlardropVersion.VERSION = "0.0.0-dev" and every Apple
      # crash reports a release no pipeline ever creates. Only set on the jobs that drive an
      # Xcode build; elsewhere the `-P` flag above reaches the compiler directly, and the
      # dotted property takes precedence over this alias regardless.
      ORG_GRADLE_PROJECT_klardropVersion: ${{ needs.gate.outputs.semver }}

      # Sentry DSN, baked in at compile time. Kept out of the tree because this repo is
      # public and a DSN is a write-only ingest endpoint — a committed one is free quota
      # for anyone scraping GitHub. Passed as ORG_GRADLE_PROJECT_* rather than a `-P` flag
      # because the Apple frameworks are built by xcodebuild running `syncFramework` from
      # the podspec script phase, which inherits the environment but not this job's Gradle
      # arguments. Absent from build_pr.yml on purpose: PR builds must not report.
      ORG_GRADLE_PROJECT_klardropSentryDsn: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect Apple signing secrets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}" ] || [ -z "${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}" ]; then
            echo "Apple distribution cert / API key absent — skipping TestFlight upload."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select latest stable Xcode
        if: steps.signing.outputs.enabled == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # JDK 21 is REQUIRED — the Kotlin pod syncFramework script phase (run by
      # xcodebuild during archive) is pinned to JDK 21.
      - uses: actions/setup-java@v5
        if: steps.signing.outputs.enabled == 'true'
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.signing.outputs.enabled == 'true'

      # ~/.konan (Kotlin/Native compiler + Apple platform libs) lives outside the
      # Gradle home setup-gradle caches, so cache it explicitly — skips the ~1GB
      # download per run. Keyed on the version catalog (Kotlin/konan version).
      - name: Cache Kotlin/Native (~/.konan)
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/dependencies.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # iOS pulls sentry-cocoa through CocoaPods directly (unlike macOS, which needs the
      # synthetic Release framework prebuilt), so only the dummy framework + pod
      # install are needed before xcodebuild — mirrors build_pr.yml's iOS build.
      - name: Prebuild Kotlin framework + pod install
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          ./gradlew :presentation:generateDummyFramework $GRADLE_VERSION_ARGS
          pod install --project-directory=iosApp

      - name: Import Apple Distribution cert
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12:    ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PW: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain"
          KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC"

      - name: Write App Store Connect API key
        if: steps.signing.outputs.enabled == 'true'
        env:
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$API_KEY_P8" | base64 -d > "$RUNNER_TEMP/keys/AuthKey_${API_KEY_ID}.p8"

      # Archive WITHOUT code signing — signing happens once, at export (the same split the
      # macOS job below uses).
      #
      # `xcodebuild archive` under automatic signing always resolves a *development*
      # identity (the iosApp target even pins CODE_SIGN_IDENTITY = "Apple Development"),
      # so archiving with -allowProvisioningUpdates made Xcode mint a fresh Apple
      # Development certificate + "iOS App Development" profiles on every nightly. CI only
      # holds the Apple Distribution cert, and once the account's certificate slots filled
      # up every run died before building anything:
      #   error: Choose a certificate to revoke. Your account has reached the maximum
      #          number of certificates.
      #   error: No profiles for 'com.carlom.Klardrop' were found: Xcode couldn't find any
      #          iOS App Development provisioning profiles matching 'com.carlom.Klardrop'.
      # With signing off, no development cert or profile is needed (or created) at all.
      - name: Archive iosApp (unsigned)
        if: steps.signing.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.gate.outputs.base }}
          BUILD:   ${{ needs.gate.outputs.versionCode }}
        run: |
          set -euo pipefail
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Klardrop.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD"

      # Upload the archive's dSYMs to Sentry straight after archiving. Sentry matches a
      # dSYM to a crash by Mach-O UUID, and neither the export nor the re-sign below changes
      # LC_UUID (codesign only rewrites the signature blob), so this covers the shipped app.
      # Without it an Apple crash report reaches Sentry as bare load addresses with no Kotlin
      # frames — the release binary is stripped and the DWARF only exists here on the runner.
      # continue-on-error: symbolication must never be the reason a release fails to ship.
      - name: Upload dSYMs to Sentry
        if: steps.signing.outputs.enabled == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: ./scripts/upload_dsyms.sh "$RUNNER_TEMP/Klardrop.xcarchive"

      # Also keep them downloadable: the runner (and the archive) is gone within minutes, so
      # a build whose upload failed would otherwise be permanently unsymbolicatable.
      - name: Save dSYMs as a build artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dsyms-ios
          path: ${{ runner.temp }}/Klardrop.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 30

      # Export to disk first (destination=export) rather than straight to upload, so the
      # signed .ipa can be inspected before it ships. -allowProvisioningUpdates + the API
      # key lets Xcode create the App Store *distribution* profiles for the app + share
      # extension on the fly and sign with the Apple Distribution cert in the keychain;
      # profiles are free to create, so this doesn't touch the certificate limit.
      #
      # manageAppVersionAndBuildNumber=false: Xcode otherwise rewrites CFBundleVersion on
      # App Store exports, which would discard the gate's commit-derived versionCode.
      - name: Export signed .ipa
        if: steps.signing.outputs.enabled == 'true'
        env:
          TEAM_ID:    ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>${TEAM_ID}</string>
          <key>signingStyle</key><string>automatic</string>
          <key>destination</key><string>export</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Klardrop.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

      # The archive is unsigned, so the exported bundles get their entitlements from the
      # App Store provisioning profile rather than from the built binaries. That's the
      # intended behaviour, but it means a capability missing from the App ID would
      # silently produce an app whose share extension can't reach the shared container.
      # Fail here instead of shipping that to testers.
      - name: Verify the exported app is distribution-signed and kept its App Group
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          IPA="$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)"
          echo "Exported: $IPA"
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP="$(ls -d "$RUNNER_TEMP/ipa/Payload"/*.app | head -1)"
          APPEX="$(ls -d "$APP/PlugIns"/*.appex 2>/dev/null | head -1 || true)"
          test -n "$APPEX" \
            || { echo "::error::the exported app embeds no share extension — KlardropShare was dropped from the archive"; exit 1; }
          codesign -dvv "$APP" 2>&1 | grep -q 'Authority=Apple Distribution' \
            || { echo "::error::$APP is not signed with an Apple Distribution certificate"; exit 1; }
          for b in "$APP" "$APPEX"; do
            codesign -d --entitlements - --xml "$b" 2>/dev/null \
              | grep -q 'group.com.carlom.Klardrop' \
              || { echo "::error::$b is missing the group.com.carlom.Klardrop App Group entitlement — the share extension would not reach the app's shared container. Check that App Groups is enabled on the App ID."; exit 1; }
          done

      # xcodebuild can only upload from an archive, not from an .ipa, so the upload is a
      # second export of the same archive with destination=upload. It re-signs identically
      # from the same profiles — the export above is what gates it.
      - name: Upload to TestFlight
        if: steps.signing.outputs.enabled == 'true'
        env:
          TEAM_ID:    ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/UploadOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>${TEAM_ID}</string>
          <key>signingStyle</key><string>automatic</string>
          <key>destination</key><string>upload</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Klardrop.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/UploadOptions.plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

  # Linux universal tarball (bundled JRE), uploaded as an artifact the `publish` job
  # attaches to the nightly prerelease. (No ProGuard smoke gate here — that runs on
  # the production release; nightly stays lean.)
  linux:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      # version = pre-release semver → KlardropVersion.VERSION (the app's displayed +
      # updater version, so it compares correctly against the nightly latest.json).
      # packageVersion = numeric base → jpackage (which rejects the -nightly suffix).
      # updateChannel = nightly → the app polls the nightly latest.json and self-updates
      # to newer nightlies instead of the stable release.
      GRADLE_VERSION_ARGS: >-
        -Pklardrop.version=${{ needs.gate.outputs.semver }}
        -Pklardrop.packageVersion=${{ needs.gate.outputs.base }}
        -Pklardrop.versionCode=${{ needs.gate.outputs.versionCode }}
        -Pklardrop.updateChannel=nightly
      # Sentry DSN, baked in at compile time. Kept out of the tree because this repo is
      # public and a DSN is a write-only ingest endpoint — a committed one is free quota
      # for anyone scraping GitHub. Passed as ORG_GRADLE_PROJECT_* rather than a `-P` flag
      # because the Apple frameworks are built by xcodebuild running `syncFramework` from
      # the podspec script phase, which inherits the environment but not this job's Gradle
      # arguments. Absent from build_pr.yml on purpose: PR builds must not report.
      ORG_GRADLE_PROJECT_klardropSentryDsn: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build Linux app-image
        run: ./gradlew :desktop:createReleaseDistributable $GRADLE_VERSION_ARGS

      - name: Stage Linux universal tarball
        shell: bash
        run: |
          set -euo pipefail
          APPDIR=desktop/build/compose/binaries/main-release/app
          STAGE=stage/klardrop-linux-x64
          rm -rf stage && mkdir -p "$STAGE/icons"
          cp -r "$APPDIR/klardrop" "$STAGE/klardrop"
          cp packaging/linux/klardrop.desktop "$STAGE/"
          cp packaging/linux/com.carlom.Klardrop.metainfo.xml "$STAGE/"
          for s in 32 64 128 256 512; do
            mkdir -p "$STAGE/icons/${s}x${s}"
            cp "brand/klardrop-icon-${s}.png" "$STAGE/icons/${s}x${s}/klardrop.png"
          done
          mkdir -p "$STAGE/icons/scalable"
          cp brand/klardrop-icon.svg "$STAGE/icons/scalable/klardrop.svg"
          mkdir -p dist
          tar -czf dist/klardrop-linux-x64.tar.gz -C stage klardrop-linux-x64
          rm -rf stage
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-linux
          path: dist/*
          if-no-files-found: error

  # Native macOS DMG. Signed + notarized when the Apple secrets are present (same
  # flow as the production build), otherwise an unsigned DMG for testers.
  macos:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: macos-latest
    env:
      # `version` is the nightly semver (1.0.1-nightly.N) so KlardropVersion.VERSION -- and
      # therefore the Sentry release these crashes report against -- matches the android and
      # linux jobs. It used to be the bare `base`, which meant Apple nightly crashes landed on
      # the *future stable* 1.0.1 release, mixing tester crashes into a version that had not
      # shipped. `packageVersion` keeps the bare form for anything that needs a strictly
      # numeric x.y.z. Note the user-visible CFBundleShortVersionString is unaffected: the
      # nightly Apple artifacts come from xcodebuild + hdiutil, not jpackage, and take their
      # marketing version from MARKETING_VERSION on the xcodebuild line.
      GRADLE_VERSION_ARGS: >-
        -Pklardrop.version=${{ needs.gate.outputs.semver }}
        -Pklardrop.packageVersion=${{ needs.gate.outputs.base }}
        -Pklardrop.versionCode=${{ needs.gate.outputs.versionCode }}

      # Same version, exported the ORG_GRADLE_PROJECT_ way, for the same reason as the DSN
      # below: the Kotlin framework this job ships is built by xcodebuild running
      # `syncFramework` from the podspec script phase, which never sees $GRADLE_VERSION_ARGS.
      # Without it the framework embeds KlardropVersion.VERSION = "0.0.0-dev" and every Apple
      # crash reports a release no pipeline ever creates. Only set on the jobs that drive an
      # Xcode build; elsewhere the `-P` flag above reaches the compiler directly, and the
      # dotted property takes precedence over this alias regardless.
      ORG_GRADLE_PROJECT_klardropVersion: ${{ needs.gate.outputs.semver }}

      # Sentry DSN, baked in at compile time. Kept out of the tree because this repo is
      # public and a DSN is a write-only ingest endpoint — a committed one is free quota
      # for anyone scraping GitHub. Passed as ORG_GRADLE_PROJECT_* rather than a `-P` flag
      # because the Apple frameworks are built by xcodebuild running `syncFramework` from
      # the podspec script phase, which inherits the environment but not this job's Gradle
      # arguments. Absent from build_pr.yml on purpose: PR builds must not report.
      ORG_GRADLE_PROJECT_klardropSentryDsn: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v6

      # Cache ~/.konan (Kotlin/Native compiler + Apple platform libs) — outside the
      # Gradle home setup-gradle caches. Keyed on the version catalog.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/dependencies.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Build Kotlin macOS frameworks (Sentry synthetic + dummy)
        run: ./gradlew :klardrop-common:podBuildSentryMacos :presentation:generateDummyFramework $GRADLE_VERSION_ARGS

      - name: pod install
        run: pod install --project-directory=iosApp

      - name: Detect Apple signing secrets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}" ] || [ -z "${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}" ]; then
            echo "Apple signing/notarization secrets absent — building UNSIGNED .dmg."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID cert (signed builds only)
        if: steps.signing.outputs.signed == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain"
          KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC"

      - name: Archive KlardropMac
        env:
          VERSION: ${{ needs.gate.outputs.base }}
          BUILD:   ${{ needs.gate.outputs.versionCode }}
        run: |
          set -euo pipefail
          # Archive WITHOUT signing. Signing for signed builds happens in the export step
          # below (method=developer-id, automatic) — that's also where Xcode fetches the
          # Developer ID provisioning profile carrying keychain-access-groups.
          # Mixing CODE_SIGN_STYLE=Automatic with a manual CODE_SIGN_IDENTITY override is a
          # hard "conflicting provisioning settings" error on every target, so we never sign here.
          # arm64-only: the Kotlin presentation.framework is built for the runner's
          # arch (Apple Silicon), so a universal (arm64+x86_64) archive fails with
          # "could not find module 'presentation' for target 'x86_64-apple-macos'".
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace -scheme KlardropMac \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/KlardropMac.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD"

      # Upload the archive's dSYMs to Sentry straight after archiving. Sentry matches a
      # dSYM to a crash by Mach-O UUID, and neither the export nor the re-sign below changes
      # LC_UUID (codesign only rewrites the signature blob), so this covers the shipped app.
      # Without it an Apple crash report reaches Sentry as bare load addresses with no Kotlin
      # frames — the release binary is stripped and the DWARF only exists here on the runner.
      # continue-on-error: symbolication must never be the reason a release fails to ship.
      - name: Upload dSYMs to Sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: ./scripts/upload_dsyms.sh "$RUNNER_TEMP/KlardropMac.xcarchive"

      # Also keep them downloadable: the runner (and the archive) is gone within minutes, so
      # a build whose upload failed would otherwise be permanently unsymbolicatable.
      - name: Save dSYMs as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dsyms-macos
          path: ${{ runner.temp }}/KlardropMac.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 30

      - name: Export signed .app (signed builds only)
        if: steps.signing.outputs.signed == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          TEAM_ID:    ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$API_KEY_P8" | base64 -d > "$RUNNER_TEMP/keys/AuthKey.p8"
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict>
          </plist>
          EOF
          # -allowProvisioningUpdates + API key lets Xcode fetch/create the Developer ID
          # profile and re-sign the app, nested frameworks and the share extension with the
          # Developer ID Application cert imported into the keychain.
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KlardropMac.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

          # -exportArchive (developer-id) signs the executables WITHOUT --options runtime, so
          # notarization rejects them: "The executable does not have the hardened runtime enabled"
          # (Klardrop + KlardropMacShare.appex). Re-sign inside-out WITH hardened runtime.
          #
          # exportArchive emits an empty entitlements set (the Developer ID profile carries none),
          # so re-signing from the post-export signature drops app-sandbox, app-groups, network,
          # etc. A share extension MUST stay sandboxed or the host app won't even launch
          # (RunningBoard "Launchd job spawn failed", POSIX 163). Re-sign each bundle from its repo
          # .entitlements instead, expanding $(AppIdentifierPrefix) -> TEAMID. so no Xcode variable
          # leaks in. This also restores the team-prefixed keychain-access-groups (without it the
          # data-protection keychain fails with errSecMissingEntitlement and macOS pops a "enter
          # your keychain password" dialog on every signing op).
          APP="$RUNNER_TEMP/export/Klardrop.app"

          # A sandboxed Developer ID app declaring an App Group must ship an embedded
          # provisioning profile or macOS refuses to spawn it (RunningBoard 163).
          # exportArchive (method=developer-id) does NOT embed one, so create + embed the
          # Developer ID profiles ourselves (one per bundle id) BEFORE re-signing seals them.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/embed_devid_profiles.py \
            --p8 "$RUNNER_TEMP/keys/AuthKey.p8" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER" --team "$TEAM_ID" \
            --bundle "com.carlom.Klardrop=$APP/Contents/embedded.provisionprofile" \
            --bundle "com.carlom.Klardrop.MacShare=$APP/Contents/PlugIns/KlardropMacShare.appex/Contents/embedded.provisionprofile"

          resign() {
            local bundle="$1" src="$2" ent
            ent="$(mktemp)"
            sed "s/\$(AppIdentifierPrefix)/${TEAM_ID}./g" "$src" > "$ent"
            codesign --force --options runtime --timestamp \
              --sign "Developer ID Application" --entitlements "$ent" "$bundle"
          }
          # extension first so the app's outer signature seals the re-signed extension
          resign "$APP/Contents/PlugIns/KlardropMacShare.appex" "iosApp/Klardrop Mac Share/KlardropMacShare.entitlements"
          resign "$APP" "iosApp/iosApp/KlardropMac.entitlements"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # don't ship a broken build. These pass codesign/spctl/notarization yet die at launch
          # with RunningBoard "Launchd job spawn failed" (POSIX 163):
          #  - an app extension that isn't sandboxed, or
          #  - a bundle declaring an App Group with no embedded provisioning profile to authorize it.
          codesign -d --entitlements - --xml "$APP/Contents/PlugIns/KlardropMacShare.appex" 2>/dev/null \
            | grep -q "com.apple.security.app-sandbox" \
            || { echo "::error::app-sandbox missing from KlardropMacShare.appex"; exit 1; }
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q "${TEAM_ID}.com.carlom.Klardrop" \
            || { echo "::error::keychain-access-groups missing from signed Klardrop.app"; exit 1; }
          for b in "$APP" "$APP/Contents/PlugIns/KlardropMacShare.appex"; do
            codesign -d --entitlements - --xml "$b" 2>/dev/null \
              | grep -q "com.apple.security.application-groups" || continue
            test -f "$b/Contents/embedded.provisionprofile" \
              || { echo "::error::$b declares an App Group but has no embedded.provisionprofile -> will fail to launch (163). The embed_devid_profiles.py step did not embed it."; exit 1; }
          done

      - name: Stage .app, notarize, build DMG
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          VERSION:    ${{ needs.gate.outputs.base }}
          SIGNED:     ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          if [ "$SIGNED" = "true" ]; then
            APP="$RUNNER_TEMP/export/Klardrop.app"
          else
            APP="$RUNNER_TEMP/KlardropMac.xcarchive/Products/Applications/Klardrop.app"
          fi
          cp -R "$APP" stage/

          if [ "$SIGNED" = "true" ]; then
            mkdir -p "$RUNNER_TEMP/keys"
            echo "$API_KEY_P8" | base64 -d > "$RUNNER_TEMP/keys/AuthKey.p8"
            AUTH=(--key "$RUNNER_TEMP/keys/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER")
            # Submit one file and fail on anything but Accepted. `submit --wait` exits 0 even when
            # the result is Invalid, so parse the status and, on failure, dump the notary log
            # (which names the offending files) before exiting.
            notarize() {
              local f="$1" out id status
              out="$(xcrun notarytool submit "$f" "${AUTH[@]}" --wait --output-format json)"
              echo "$out"
              id="$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
              status="$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
              if [ "$status" != "Accepted" ]; then
                echo "::error::Notarization $status for $f — see log below"
                xcrun notarytool log "$id" "${AUTH[@]}" || true
                exit 1
              fi
            }

            # Notarize + staple the .app FIRST so the notarization ticket is embedded in the
            # bundle. Homebrew copies Klardrop.app OUT of the DMG into /Applications, where the
            # DMG's own staple is unreachable; without an app-level ticket Gatekeeper falls back
            # to an online notarization lookup, which fails offline / behind firewalls and shows
            # "Apple could not verify Klardrop is free of malware" on first launch. Stapling the
            # app lets Gatekeeper validate it with no network.
            ditto -c -k --keepParent stage/Klardrop.app "$RUNNER_TEMP/Klardrop.app.zip"
            notarize "$RUNNER_TEMP/Klardrop.app.zip"
            xcrun stapler staple stage/Klardrop.app
          fi

          ln -s /Applications stage/Applications
          hdiutil create -volname Klardrop -srcfolder stage -ov -format UDZO \
            "dist/klardrop-${VERSION}.dmg"

          # Notarize + staple the DMG too, so a direct .dmg download is trusted on first open.
          if [ "$SIGNED" = "true" ]; then
            notarize "dist/klardrop-${VERSION}.dmg"
            xcrun stapler staple "dist/klardrop-${VERSION}.dmg"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-macos
          path: dist/*
          if-no-files-found: error

  # Collect the desktop artifacts and (re)publish the rolling `nightly` prerelease on top
  # of the tag the `gate` already advanced to this commit. Runs only when every build job
  # succeeded. prerelease:true keeps it off `releases/latest`, so install.sh / Homebrew
  # (which track the stable release) are unaffected.
  publish:
    needs: [gate, android, ios, linux, macos]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # latest.json (+ .sha256 sidecars) so the in-app updater on the nightly channel has
      # a manifest to poll. URLs point at the fixed `nightly` tag; version is the
      # pre-release semver so the comparator orders successive nightlies. Mirrors the
      # stable publish job, scoped to the assets the nightly produces (DMG + Linux tarball).
      - name: Generate checksums + nightly latest.json
        env:
          REPO:    ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.semver }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          for f in *; do
            if [ -f "$f" ] && [[ "$f" != *.sha256 ]] && [[ "$f" != "latest.json" ]]; then
              sha256sum "$f" | awk '{print $1}' > "$f.sha256"
            fi
          done
          pick() { ls $1 2>/dev/null | head -n1 || true; }
          DMG=$(pick "*.dmg")
          TGZ=$(pick "*.tar.gz")
          export BASE="https://github.com/${REPO}/releases/download/nightly"
          python3 - "$DMG" "$TGZ" <<'PY' > latest.json
          import json, os, sys, datetime, pathlib
          dmg, tgz = sys.argv[1:3]
          base = os.environ["BASE"]
          def entry(name):
              if not name: return None
              digest = pathlib.Path(name + ".sha256").read_text().strip()
              size   = pathlib.Path(name).stat().st_size
              return {"url": f"{base}/{name}", "sha256": digest, "size": size}
          platforms = {}
          if dmg: platforms["macos"]         = entry(dmg)
          if tgz: platforms["linux-tarball"] = entry(tgz)
          out = {
            "version":     os.environ["VERSION"],
            "tag":         "nightly",
            "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "notes":       f"https://github.com/{os.environ['REPO']}/releases/tag/nightly",
            "platforms":   platforms,
          }
          print(json.dumps(out, indent=2))
          PY
          cat latest.json

      # Delete the previous nightly release first, then recreate it from scratch below,
      # so only the latest nightly's binaries are ever stored (the version-stamped DMG
      # name changes whenever the base version bumps, so updating-in-place would otherwise
      # leave stale assets behind and grow GitHub storage without bound). The git tag is
      # kept (already advanced to this commit by the gate) and reused by the release below.
      - name: Delete the previous nightly release (keep only the latest binaries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete nightly --repo "${{ github.repository }}" --yes || true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Klardrop ${{ needs.gate.outputs.semver }}"
          body: "Automated nightly tester build ${{ needs.gate.outputs.semver }} (build ${{ needs.gate.outputs.versionCode }}). Not for production use."
          prerelease: true
          files: artifacts/*
          fail_on_unmatched_files: true

      # Bump the `klardrop-nightly` cask in the tap so testers can
      # `brew install --cask carlonzo/klardrop/klardrop-nightly` and `brew upgrade` to
      # each new build (cask version = full semver, so the version bump is what triggers
      # the upgrade — the rolling `nightly` url stays fixed). Separate token from the
      # stable `klardrop` cask. Non-fatal: the release is already published above.
      - name: Publish nightly Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION:   ${{ needs.gate.outputs.semver }}
          BASE:      ${{ needs.gate.outputs.base }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping nightly Homebrew publish."; exit 0
          fi
          DMG="klardrop-${BASE}.dmg"
          SHA="$(cat "artifacts/${DMG}.sha256")"
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA}/g" -e "s/@DMG@/${DMG}/g" \
            packaging/homebrew/klardrop-nightly.rb > klardrop-nightly.rb
          echo "--- rendered cask ---"; cat klardrop-nightly.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/carlonzo/homebrew-klardrop.git" tap
          mkdir -p tap/Casks
          cp klardrop-nightly.rb tap/Casks/klardrop-nightly.rb
          cd tap
          git config user.name "klardrop-ci"
          git config user.email "carlo.marinangeli@gmail.com"
          git add Casks/klardrop-nightly.rb
          git commit -m "klardrop-nightly ${VERSION}" || { echo "no cask change"; exit 0; }
          git push

  # Finalize once every build job succeeded and the prerelease is published. Deploy
  # environment is `nightly`, not `production`: the stable pipeline records the production
  # deploy for the same project, and keeping them apart is what lets Sentry answer "is this
  # crash only on the tester track?" — which is the whole point of having a tester track.
  sentry-finalize:
    needs: [gate, sentry-release, publish]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG:        ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT:    ${{ vars.SENTRY_PROJECT }}
      VERSION:           ${{ needs.gate.outputs.semver }}
    steps:
      # No checkout: finalize and deploys are pure API calls against the release name.
      - name: Finalize Sentry release + record the nightly deploy
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "SENTRY_AUTH_TOKEN not set — skipping Sentry release finalize (fork or unconfigured repo)."
            exit 0
          fi

          # Pinned for the same supply-chain reason as in `sentry-release` above.
          curl -fsSL https://sentry.io/get-cli/ \
            | INSTALL_DIR="$RUNNER_TEMP/sentry-cli" SENTRY_CLI_VERSION=3.6.2 bash
          export PATH="$RUNNER_TEMP/sentry-cli:$PATH"

          sentry-cli releases finalize "$VERSION"
          sentry-cli deploys new -r "$VERSION" -e nightly
