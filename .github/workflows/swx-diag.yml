# TEMPORARY diagnostic — bisects the swift-export StackOverflowError. Delete before merge.
name: swx-diag

on:
  push:
    branches: [swx-diag]

permissions:
  contents: read

jobs:
  swx:
    name: swx ${{ matrix.variant }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, no-filekit, no-common-export]
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve Sentry SPM
        run: xcodebuild -resolvePackageDependencies -project iosApp/iosApp.xcodeproj

      - name: Apply variant
        run: |
          case "${{ matrix.variant }}" in
            no-filekit) sed -i '/export(deps.filekit.core) {/,/^    }/d' presentation/build.gradle.kts ;;
            no-common-export) sed -i '/export(project(":klardrop-common")) {/,/^    }/d' presentation/build.gradle.kts ;;
          esac
          grep -n -A3 "swiftExport {" presentation/build.gradle.kts

      - name: Run swift export (iOS sim)
        run: |
          set +e
          ./gradlew :presentation:iosSimulatorArm64DebugSwiftExport --stacktrace --console=plain 2>&1 | tee swx.log
          code=${PIPESTATUS[0]}
          echo "RESULT variant=${{ matrix.variant }} exit=$code stackoverflows=$(grep -c StackOverflowError swx.log)"
          exit 0
