# TEMPORARY diagnostic — bisects the swift-export StackOverflowError. Delete before merge.
name: swx-diag

on:
  push:
    branches: [swx-diag]

permissions:
  contents: read

jobs:
  swx:
    name: swx ${{ matrix.variant }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, no-filekit, no-common-export]
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve Sentry SPM
        run: xcodebuild -resolvePackageDependencies -project iosApp/iosApp.xcodeproj

      - name: Apply variant
        run: |
          python3 - "${{ matrix.variant }}" <<'PY'
          import sys
          variant = sys.argv[1]
          marker = {"no-filekit": "export(deps.filekit.core) {",
                    "no-common-export": 'export(project(":klardrop-common")) {'}.get(variant)
          p = "presentation/build.gradle.kts"
          lines = open(p).read().split("\n")
          if marker:
              i = next(n for n, l in enumerate(lines) if marker in l)
              j = next(n for n in range(i + 1, len(lines)) if lines[n] == "    }")
              del lines[i:j + 1]
          open(p, "w").write("\n".join(lines))
          print("variant", variant, "applied:", marker is not None)
          PY
          grep -n -A3 "swiftExport {" presentation/build.gradle.kts

      - name: Run Xcode build (drives embedSwiftExportForXcode)
        run: |
          set +e
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 > xcb.log 2>&1
          code=$?
          echo "RESULT variant=${{ matrix.variant }} exit=$code stackoverflows=$(grep -c StackOverflowError xcb.log) swiftexport=$(grep -c 'SwiftExport FAILED' xcb.log)"
          grep -E "error:|What went wrong" xcb.log | head -8
          exit 0
