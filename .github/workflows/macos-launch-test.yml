# TEMPORARY: reproduce + fix the macOS "error 163" launch failure directly on CI.
# Mirrors the release-nightly macOS signing flow (archive -> export -> embed Developer ID
# provisioning profiles -> resign) but SKIPS notarization (163 is a local amfi/launchd
# spawn-validation failure, independent of the notarization ticket) and then actually
# LAUNCHES the app to prove it spawns. Delete once the real release pipelines are verified.
name: macOS launch test (temp)

on:
  push:
    branches: [claude/macos-launch-error-163-ag0116]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/dependencies.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Build Kotlin macOS frameworks (Bugsnag synthetic + dummy)
        run: ./gradlew :klardrop-common:podBuildBugsnagMacos :presentation:generateDummyFramework

      - name: pod install
        run: pod install --project-directory=iosApp

      - name: Import Developer ID cert
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain"
          KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC"

      - name: Archive KlardropMac (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace -scheme KlardropMac \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/KlardropMac.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="1.0.0" CURRENT_PROJECT_VERSION="1"

      - name: Export signed .app + embed profiles + resign
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          TEAM_ID:    ${{ secrets.APPLE_TEAM_ID }}
          CERT_PW:    ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$API_KEY_P8" | base64 -d > "$RUNNER_TEMP/keys/AuthKey.p8"
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KlardropMac.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

          APP="$RUNNER_TEMP/export/Klardrop.app"

          CERT_SERIAL="$(openssl pkcs12 -legacy -in "$RUNNER_TEMP/cert.p12" -nokeys -passin pass:"$CERT_PW" 2>/dev/null | openssl x509 -noout -serial | cut -d= -f2)"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/embed_devid_profiles.py \
            --p8 "$RUNNER_TEMP/keys/AuthKey.p8" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER" --team "$TEAM_ID" --cert-serial "$CERT_SERIAL" \
            --bundle "com.carlom.Klardrop=$APP/Contents/embedded.provisionprofile" \
            --bundle "com.carlom.Klardrop.MacShare=$APP/Contents/PlugIns/KlardropMacShare.appex/Contents/embedded.provisionprofile"

          # CONTROL RUN: application-identifier injection intentionally DISABLED to confirm
          # this reproduces #469's 163 (profile embedded but not bound). Expect launch to FAIL.
          resign() {
            local bundle="$1" src="$2" appid="$3" ent
            ent="$(mktemp)"
            sed "s/\$(AppIdentifierPrefix)/${TEAM_ID}./g" "$src" > "$ent"
            codesign --force --options runtime --timestamp \
              --sign "Developer ID Application" --entitlements "$ent" "$bundle"
          }
          resign "$APP/Contents/PlugIns/KlardropMacShare.appex" "iosApp/Klardrop Mac Share/KlardropMacShare.entitlements" "com.carlom.Klardrop.MacShare"
          resign "$APP" "iosApp/iosApp/KlardropMac.entitlements" "com.carlom.Klardrop"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Inspect signature, entitlements + embedded profiles
        run: |
          set -uo pipefail
          APP="$RUNNER_TEMP/export/Klardrop.app"
          for b in "$APP" "$APP/Contents/PlugIns/KlardropMacShare.appex"; do
            echo "::group::$b — codesign -dv"
            codesign -dv --verbose=4 "$b" 2>&1 || true
            echo "::endgroup::"
            echo "::group::$b — entitlements"
            codesign -d --entitlements - --xml "$b" 2>/dev/null | plutil -convert xml1 -o - - 2>/dev/null || true
            echo "::endgroup::"
            echo "::group::$b — embedded.provisionprofile entitlements"
            prof="$b/Contents/embedded.provisionprofile"
            if [ -f "$prof" ]; then
              security cms -D -i "$prof" 2>/dev/null | plutil -extract Entitlements xml1 -o - - 2>/dev/null || true
            else
              echo "NO embedded.provisionprofile"
            fi
            echo "::endgroup::"
          done

      - name: Launch the app (the actual 163 reproduction)
        run: |
          set -uo pipefail
          APP="$RUNNER_TEMP/export/Klardrop.app"
          EXE="$APP/Contents/MacOS/Klardrop"
          xattr -cr "$APP" || true
          echo "spctl assessment:"; spctl -a -t exec -vvv "$APP" 2>&1 || true

          echo "=== open $APP ==="
          set +e
          OUT="$(open "$APP" 2>&1)"; RC=$?
          set -e 2>/dev/null || true
          echo "open rc=$RC :: $OUT"
          sleep 12

          RUNNING="$(pgrep -xf "$EXE" || true)"
          echo "::group::system log (last 120s: amfi / RunningBoard / Klardrop / launchd)"
          log show --last 120s --style compact \
            --predicate '(eventMessage CONTAINS[c] "Klardrop") OR (process == "amfid") OR (process == "launchd") OR (senderImagePath CONTAINS "RunningBoard") OR (subsystem == "com.apple.amfi")' 2>/dev/null | tail -200 || true
          echo "::endgroup::"

          if [ -n "$RUNNING" ]; then
            echo "::notice::✅ LAUNCH OK — Klardrop is running (pid $RUNNING), no 163"
            kill "$RUNNING" 2>/dev/null || true
            exit 0
          fi

          echo "::error::❌ LAUNCH FAILED — Klardrop did not stay running (open rc=$RC: $OUT)"
          exit 1
