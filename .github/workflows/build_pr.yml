name: Build with Gradle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Linux carries the bulk of the test suite: common, Android host-tests, desktop JVM,
  # CLI. Kotlin/Native mac/iOS targets are skipped automatically when no Apple
  # toolchain is present, so we run a plain `./gradlew build` and let host-locking
  # decide what compiles.
  build-linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        # Exclude :presentation's Apple shared-metadata compiles. On Linux there is no Apple
        # toolchain, so :klardrop-common's native targets are disabled (its Sentry cinterop
        # can't be processed here) and its iosMain/appleMain metadata is skipped. :presentation
        # would still try to compile its own Apple metadata, but can't resolve klardrop-common's
        # now-absent native `actual`s (e.g. InternalPlatformDependencies' constructor) and fails.
        # Apple is fully built and tested on the macOS job, so skip it here.
        run: >-
          ./gradlew build
          -x :presentation:compileIosMainKotlinMetadata
          -x :presentation:compileAppleMainKotlinMetadata

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Test Results (Linux)
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit

  # macOS only runs the targets Linux can't: the iOS simulator tests and the macOS
  # native tests. Everything else is already covered on the Linux job, so we keep
  # this minimal to save Mac runner minutes.
  build-macos:
    name: Test (macOS / iOS)
    # macos-26 ships Xcode 26 (matches local dev + Kotlin/Native's bundled SDK). The default
    # macos-latest image's Xcode 16.4 (SDK 15.5) is too old: Kotlin/Native's AppKit/CoreFoundation
    # platform klibs reference newer-SDK symbols, so the Xcode link of the macOS/iOS apps fails
    # with "Undefined symbols for architecture arm64". select-xcode pins the newest stable Xcode.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6

      # Cache ~/.konan (Kotlin/Native compiler + Apple platform libs) — outside the
      # Gradle home setup-gradle caches. Keyed on the version catalog.
      #
      # Split restore/save rather than actions/cache: the combined action's post
      # step does not save when the job failed. On a Kotlin bump the catalog hash
      # changes, so the exact key misses and restore-keys hands back the PREVIOUS
      # Kotlin's ~/.konan — useless for the new compiler, which then downloads and
      # rebuilds from scratch. That cold build is what pushes this job over its
      # budget, and the resulting failure is precisely what stops the fresh cache
      # from being written, so every retry pays the same cost again. Saving on
      # always() breaks that loop: the first attempt seeds the new Kotlin's konan
      # dir even though it went red, and the retry starts warm.
      - name: Restore Kotlin/Native (~/.konan)
        id: konan-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/dependencies.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Compile and link the native test binaries as their own step, before running
      # them. These tests talk over real loopback sockets with multi-second connect
      # and pumping deadlines, and Gradle will happily run one module's tests while
      # another module is still linking — on a runner that reports as few as 3
      # processors, that contention alone times the sockets out ("Could not connect
      # to server..."). Building first means the test step starts on an idle box.
      - name: Compile & link native tests
        # Generous: on a Kotlin bump this is a from-scratch Kotlin/Native build of
        # the compiler caches and Apple platform klibs, not an incremental one.
        timeout-minutes: 60
        run: |
          ./gradlew \
            :klardrop-common:linkDebugTestIosSimulatorArm64 \
            :presentation:linkDebugTestIosSimulatorArm64 \
            :protos:linkDebugTestIosSimulatorArm64 \
            :klardrop-common:linkDebugTestMacosArm64 \
            :presentation:linkDebugTestMacosArm64 \
            :protos:linkDebugTestMacosArm64

      # Save regardless of what the tests below do — see the restore step above.
      - name: Save Kotlin/Native (~/.konan)
        if: ${{ always() && steps.konan-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/dependencies.toml') }}

      - name: Run macOS + iOS native tests
        # iOS Simulator + macOS native cover the shared KMP modules that Linux
        # cannot build (klardrop-common, presentation, protos). :compose-ui has
        # only android + desktopJvm targets now, so it has no Apple test task and
        # is fully covered by the Linux job. The old :common-ui (renamed :compose-ui)
        # and :macos (vestigial KN stub removed in SwiftUI migration) tasks are gone.
        #
        # Step-level timeout (NOT job-level): a wedged native test — e.g. a
        # real-socket integration test whose runTest watchdog can't preempt a
        # blocked Kotlin/Native worker — otherwise runs to the 6h job default.
        # A step timeout fails just this step, so the "Publish Test Report" step
        # below (guarded on !cancelled(), which a job cancel would skip) still
        # runs and surfaces the per-test results that did complete.
        #
        # The binaries are already linked by the step above, so this budget now
        # covers test execution alone — which has historically run ~12 minutes.
        # macOS and iOS Simulator tests are run as two sequential Gradle invocations
        # with --no-parallel: a single invocation schedules both native test workers
        # at once, and on a 3-core runner that contention has been observed to push
        # real-socket tests past this 60-minute step timeout even though every test
        # that finished had passed.
        timeout-minutes: 60
        run: |
          ./gradlew --no-parallel \
            :klardrop-common:macosArm64Test \
            :presentation:macosArm64Test \
            :protos:macosArm64Test
          ./gradlew --no-parallel \
            :klardrop-common:iosSimulatorArm64Test \
            :presentation:iosSimulatorArm64Test \
            :protos:iosSimulatorArm64Test

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Test Results (macOS / iOS)
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit

      # Build the actual iOS + macOS apps (unsigned). The unit tests above do not
      # exercise the Xcode app build, so a SwiftUI / pbxproj / SKIE / framework
      # regression would otherwise slip through. Mirrors release.yml's macOS prep.
      - name: Set up JDK 21 (Apple app build uses the project's pinned JDK)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build iOS + macOS apps (unsigned)
        run: |
          # Prebuild the Sentry macOS synthetic + dummy frameworks that the
          # cocoapods integration and macOS FRAMEWORK_SEARCH_PATHS depend on.
          ./gradlew :klardrop-common:podBuildSentryMacos :presentation:generateDummyFramework
          pod install --project-directory=iosApp
          # ARCHS=arm64: the KMP framework only builds the iosSimulatorArm64 target, so the
          # presentation.framework has no x86_64 slice. 'generic/platform=iOS Simulator'
          # otherwise also builds x86_64 and fails with "could not find module 'presentation'
          # for target 'x86_64-apple-ios-simulator'". Restrict to arm64 (CI runner is arm64).
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO ARCHS=arm64
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme KlardropMac \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO
