name: Build with Gradle

on:
  pull_request:
    branches: [main]

# Cancel a PR's in-flight run when a newer commit is pushed. Nightly and
# release workflows do not share this group.
concurrency:
  group: build-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Always runs. Build jobs are skipped from its outputs; the CI aggregator
  # below is the check branch protection should require, because a conditional
  # skip is a successful check and would satisfy an old per-job requirement.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      linux: ${{ steps.filter.outputs.linux }}
      macos: ${{ steps.filter.outputs.macos }}
      rust_macos: ${{ steps.filter.outputs.rust_macos }}
      desktop_jvm: ${{ steps.filter.outputs.desktop_jvm }}
    steps:
      - uses: actions/checkout@v7

      - name: Classify changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/path_filters.py --self-test
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename' > /tmp/changed-paths.txt
          python3 .github/path_filters.py \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --files-from /tmp/changed-paths.txt

  # One Ubuntu runner: JVM/Android/desktop/CLI tests, one linuxX64 engine link,
  # one Rust release binary, then the fixtures and installer that consume them.
  # Separate steps so a PunchThroughDialTest failure and a Qt failure name
  # different steps inside this check.
  build-linux:
    name: Build & test (Linux)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6

      # avahi/sqlite/ssl/systemd: linuxX64 cinterop and the engine link.
      # Qt packages: the two Qt suites below. One apt instead of the three
      # this workflow used to run on separate runners.
      - name: Install native and Qt build deps
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libavahi-client-dev libsqlite3-dev libssl-dev libsystemd-dev
          qt6-base-dev qt6-declarative-dev qmake6 libgl-dev
          qml6-module-qtquick qml6-module-qtquick-controls
          qml6-module-qtquick-layouts qml6-module-qtquick-templates
          qml6-module-qtquick-window qml6-module-qtqml qml6-module-qtqml-models
          qml6-module-qtqml-workerscript

      # Same key the old Qt job wrote (konan-Linux-<catalog hash>), so a warm
      # cache from main's history is a hit. actions/cache, as that job used,
      # rather than the macOS job's restore/save split.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/dependencies.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Gradle build and test
        # Exclude :presentation's Apple shared-metadata compiles. On Linux there is no Apple
        # toolchain, so :klardrop-common's native targets are disabled (its Sentry cinterop
        # can't be processed here) and its iosMain/appleMain metadata is skipped. :presentation
        # would still try to compile its own Apple metadata, but can't resolve klardrop-common's
        # now-absent native `actual`s (e.g. InternalPlatformDependencies' constructor) and fails.
        # Apple is fully built and tested on the macOS job, so skip it here.
        # `build` assembles linuxX64, including linkReleaseExecutableLinuxX64, so the
        # fixture steps reuse cli/build/bin/linuxX64/releaseExecutable/klardrop-engine.kexe
        # instead of linking the engine again.
        timeout-minutes: 60
        run: >-
          ./gradlew build
          -x :presentation:compileIosMainKotlinMetadata
          -x :presentation:compileAppleMainKotlinMetadata

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Test Results (Linux)
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit

      - name: Confirm the Gradle build produced the native engine
        run: test -x cli/build/bin/linuxX64/releaseExecutable/klardrop-engine.kexe

      - name: Cache Rust (cli-rust)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli-rust

      - name: Show Rust toolchain
        working-directory: cli-rust
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      # --locked everywhere: Cargo.lock is committed, and a build that silently
      # updated it would test dependency versions nobody reviewed.
      - name: Rust test
        working-directory: cli-rust
        run: cargo test --locked

      - name: Rust lint
        working-directory: cli-rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust format
        working-directory: cli-rust
        run: cargo fmt --all --check

      - name: Rust release build
        working-directory: cli-rust
        run: cargo build --locked --release

      - name: Native fixture (Rust client + Kotlin/Native engine)
        timeout-minutes: 45
        env:
          KLARDROP_RUST_BIN: ${{ github.workspace }}/cli-rust/target/release/klardrop
          KLARDROP_ENGINE_BIN: ${{ github.workspace }}/cli/build/bin/linuxX64/releaseExecutable/klardrop-engine.kexe
        run: ./scripts/klardrop-rust-fixture-tests.sh

      - name: Qt integration suite (fake daemon)
        timeout-minutes: 30
        run: python3 linux/qt/tests/test_integration.py

      - name: Qt frontend vs. the real engine
        timeout-minutes: 30
        env:
          KLARDROP_ENGINE_BIN: ${{ github.workspace }}/cli/build/bin/linuxX64/releaseExecutable/klardrop-engine.kexe
        run: ./scripts/klardrop-qt-real-engine-tests.sh

      - name: Production JVM-host fixture (Rust client)
        # The script starts ./gradlew :cli:jvmRun. The Gradle build above already
        # compiled that JVM graph, so this is the fixture rather than a second cold build.
        timeout-minutes: 45
        env:
          KLARDROP_RUST_BIN: ${{ github.workspace }}/cli-rust/target/release/klardrop
        run: ./scripts/klardrop-jvm-host-fixture-tests.sh

      - name: Installer tests (packaging/install.sh)
        run: bash packaging/linux/test-omarchy-install.sh

  # macOS runs what Linux cannot: Kotlin/Native Apple tests, one iOS
  # build-for-testing plus the simulator launch, and one KlardropMac build.
  build-macos:
    name: Test (macOS / iOS)
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    # macos-26 ships Xcode 26 (matches local dev + Kotlin/Native's bundled SDK). The default
    # macos-latest image's Xcode 16.4 (SDK 15.5) is too old: Kotlin/Native's AppKit/CoreFoundation
    # platform klibs reference newer-SDK symbols, so the Xcode link of the macOS/iOS apps fails
    # with "Undefined symbols for architecture arm64". select-xcode pins the newest stable Xcode.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6

      # Cache ~/.konan (Kotlin/Native compiler + Apple platform libs) — outside the
      # Gradle home setup-gradle caches. Keyed on the version catalog.
      #
      # Split restore/save rather than actions/cache: the combined action's post
      # step does not save when the job failed. On a Kotlin bump the catalog hash
      # changes, so the exact key misses and restore-keys hands back the PREVIOUS
      # Kotlin's ~/.konan — useless for the new compiler, which then downloads and
      # rebuilds from scratch. That cold build is what pushes this job over its
      # budget, and the resulting failure is precisely what stops the fresh cache
      # from being written, so every retry pays the same cost again. Saving on
      # always() breaks that loop: the first attempt seeds the new Kotlin's konan
      # dir even though it went red, and the retry starts warm.
      - name: Restore Kotlin/Native (~/.konan)
        id: konan-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/dependencies.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # sentry-kmp resolves Sentry.xcframework from the default DerivedData at
      # Gradle configuration time. Cache only SourcePackages (and the SwiftPM
      # clone cache), keyed on the pinned package versions in the pbxproj, so a
      # Swift-only edit does not re-download sentry-cocoa and a version bump does.
      - name: Read pinned SPM versions
        id: spm
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("iosApp/iosApp.xcodeproj/project.pbxproj").read_text()
          section = text.split("Begin XCRemoteSwiftPackageReference section", 1)[1]
          section = section.split("End XCRemoteSwiftPackageReference section", 1)[0]
          pins = re.findall(
              r'repositoryURL = "https://github.com/([^"]+)";.*?version = ([0-9][0-9.]*);',
              section,
              re.S,
          )
          if not pins:
              raise SystemExit("no XCRemoteSwiftPackageReference versions found")
          print("+".join(f"{repo.split('/')[-1]}-{version}" for repo, version in pins))
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "SPM cache key: ${VERSION}"

      - name: Cache Sentry SPM (SourcePackages)
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: sentry-spm-${{ runner.os }}-${{ steps.spm.outputs.version }}
          restore-keys: sentry-spm-${{ runner.os }}-

      # Keep -derivedDataPath OFF. The sentry-kmp plugin runs
      # `xcodebuild -project iosApp.xcodeproj -showBuildSettings` with no custom
      # derived data, then expects
      # <DerivedData>/SourcePackages/artifacts/sentry-cocoa/{Sentry,Sentry-Dynamic}/*.xcframework.
      - name: Resolve Sentry SPM (DerivedData for sentry-kmp)
        run: |
          xcodebuild -resolvePackageDependencies \
            -project iosApp/iosApp.xcodeproj
          find ~/Library/Developer/Xcode/DerivedData -name "Sentry*.xcframework" -maxdepth 6 2>/dev/null | head -5

      - name: Compile & link native tests
        # Generous: on a Kotlin bump this is a from-scratch Kotlin/Native build of
        # the compiler caches and Apple platform klibs, not an incremental one.
        timeout-minutes: 60
        run: |
          ./gradlew \
            :klardrop-common:linkDebugTestIosSimulatorArm64 \
            :presentation:linkDebugTestIosSimulatorArm64 \
            :protos:linkDebugTestIosSimulatorArm64 \
            :klardrop-common:linkDebugTestMacosArm64 \
            :presentation:linkDebugTestMacosArm64 \
            :protos:linkDebugTestMacosArm64 \
            :control-plane:linkDebugTestMacosArm64

      # Save regardless of what the tests below do — see the restore step above.
      - name: Save Kotlin/Native (~/.konan)
        if: ${{ always() && steps.konan-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/dependencies.toml') }}

      - name: Run macOS + iOS native tests
        # iOS Simulator + macOS native cover the shared KMP modules that Linux
        # cannot build (klardrop-common, presentation, protos, control-plane).
        # :control-plane is here for its macosArm64 target specifically: its
        # POSIX control-file actual, its per-platform capability set and the
        # ktor-network bind are the parts the shipped Klardrop.app runs and no
        # other job executes. :compose-ui has only android + desktopJvm targets
        # now, so it has no Apple test task and is fully covered by the Linux
        # job.
        #
        # Step-level timeout (NOT job-level): a wedged native test — e.g. a
        # real-socket integration test whose runTest watchdog can't preempt a
        # blocked Kotlin/Native worker — otherwise runs to the 6h job default.
        # macOS and iOS Simulator tests are two sequential Gradle invocations
        # with --no-parallel: a single invocation schedules both native test workers
        # at once, and on a 3-core runner that contention has been observed to push
        # real-socket tests past this 60-minute step timeout.
        timeout-minutes: 60
        run: |
          ./gradlew --no-parallel \
            :klardrop-common:macosArm64Test \
            :presentation:macosArm64Test \
            :protos:macosArm64Test \
            :control-plane:macosArm64Test
          ./gradlew --no-parallel \
            :klardrop-common:iosSimulatorArm64Test \
            :presentation:iosSimulatorArm64Test \
            :protos:iosSimulatorArm64Test

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Test Results (macOS / iOS)
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit

      # Same :desktop:jvmJar / :desktop:jvmTest the Linux job compiles, on the
      # Apple Silicon host. It used to be its own macos-26 job so it could
      # overlap this one. On run 39479916747 that second job waited 15m01s,
      # never received a runner (runner_id 0, no steps), and GitHub cancelled
      # it: "The job was not acquired by Runner of type hosted even after
      # multiple attempts", while this job held the only macos-26 runner.
      # The workflow concurrency group did not do it (this job kept running)
      # and neither did a timeout (no step had started; the step timeout is
      # 45 minutes). One macos-26 job per PR avoids the queue. JDK 25 is still
      # the selected JDK here; the Apple app build below switches to 21.
      # iosApp-only PRs skip this step (desktop_jvm is false) without asking
      # for another runner.
      - name: Compile macOS JVM host (desktop)
        if: needs.changes.outputs.desktop_jvm == 'true'
        timeout-minutes: 45
        run: ./gradlew :desktop:jvmJar :desktop:jvmTest

      # embedSwiftExportForXcode runs Gradle pinned to JDK 21.
      - name: Set up JDK 21 (Apple app build uses the project's pinned JDK)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'

      # One concrete arm64 simulator for build-for-testing and test-without-building.
      # A generic destination cannot boot, and a second destination is a different
      # build description, which is what made `xcodebuild test` compile iosApp again.
      - name: Select iOS simulator
        run: |
          set -euo pipefail
          DEST_ID="$(python3 - <<'PY'
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          devices = json.loads(raw)["devices"]
          preferred = []
          fallback = []
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for device in entries:
                  if not device.get("isAvailable", True):
                      continue
                  name = device.get("name", "")
                  if not name.startswith("iPhone"):
                      continue
                  fallback.append(device["udid"])
                  if "Pro" not in name and "SE" not in name and "mini" not in name:
                      preferred.append(device["udid"])
          chosen = preferred or fallback
          if not chosen:
              print("no available iPhone simulator", file=sys.stderr)
              sys.exit(1)
          print(chosen[0])
          PY
          )"
          echo "IOS_SIMULATOR_ID=${DEST_ID}" >> "$GITHUB_ENV"
          echo "iOS simulator: ${DEST_ID}"

      - name: Build iOS app for testing
        # ARCHS=arm64: the KMP framework only has an iosSimulatorArm64 slice.
        # Without it Xcode also builds x86_64 and fails looking for module
        # 'presentation'. build-for-testing produces the .xctestrun the next
        # step consumes, so there is no separate generic `xcodebuild build`.
        timeout-minutes: 45
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

      - name: Test iOS launch and Swift export bridge
        timeout-minutes: 45
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

      # KlardropMac is a second scheme. The iOS test does not compile it, and
      # it is the build that embeds the control-plane framework.
      - name: Build KlardropMac (unsigned)
        timeout-minutes: 45
        run: |
          xcodebuild build \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme KlardropMac \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  # Apple Silicon Rust client. Linux cargo test/clippy/fmt/release now live in
  # the Linux job, next to the fixtures that link the release binary.
  # macos-14 on purpose: this job needs no Xcode, no Apple SDK and no
  # Kotlin/Native, only cargo. macos-26 is for the job above.
  rust-macos:
    name: Rust client (macos-14)
    needs: changes
    if: needs.changes.outputs.rust_macos == 'true'
    runs-on: macos-26
    defaults:
      run:
        working-directory: cli-rust
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust (cli-rust)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli-rust

      - name: Show Rust toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Test
        shell: bash
        run: cargo test --locked

      - name: Lint
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Format
        shell: bash
        run: cargo fmt --all --check

  # Single stable required check. `skipped` is a pass: path filters skip jobs
  # on purpose. Anything else — failure, cancelled, or a job that never
  # started — fails this check.
  #
  # `if: always()` is required. `if: !cancelled()` does not run when a needed
  # job was cancelled, and a skipped CI check counts as a success for branch
  # protection and for Renovate. That is how a macos-26 job GitHub cancelled
  # before assigning a runner would have left CI green.
  ci:
    name: CI
    needs:
      - changes
      - build-linux
      - build-macos
      - rust-macos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        env:
          RESULT_CHANGES: ${{ needs.changes.result }}
          RESULT_LINUX: ${{ needs.build-linux.result }}
          RESULT_MACOS: ${{ needs.build-macos.result }}
          RESULT_RUST_MACOS: ${{ needs.rust-macos.result }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" result="$2"
            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "::error::$name finished with '$result' (expected success or skipped)"
                fail=1
                ;;
            esac
          }
          check "Detect changed paths" "$RESULT_CHANGES"
          check "Build & test (Linux)" "$RESULT_LINUX"
          check "Test (macOS / iOS)" "$RESULT_MACOS"
          check "Rust client (macos-14)" "$RESULT_RUST_MACOS"
          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo "CI passed. Skipped jobs were filtered out by path."
