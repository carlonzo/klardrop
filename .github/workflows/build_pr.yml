name: Build with Gradle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Linux carries the bulk of the test suite: common, Android host-tests, desktop JVM,
  # CLI. Kotlin/Native mac/iOS targets are skipped automatically when no Apple
  # toolchain is present, so we run a plain `./gradlew build` and let host-locking
  # decide what compiles.
  build-linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6

      # The Kotlin/Native Linux target cinterops against the host's avahi/openssl/systemd
      # headers and links its sqlite3, so `./gradlew build` cannot even index the linuxX64
      # cinterops without these. Same four packages the native-fixture job below and the
      # release workflow's native job install. linuxArm64 needs none of this: it is only
      # declared on an aarch64 host (see `hostCanBuildLinuxArm64`), and the release jobs
      # run that leg on a native ubuntu-24.04-arm.
      - name: Install native build deps
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libavahi-client-dev libsqlite3-dev libssl-dev libsystemd-dev

      - name: Build
        # Exclude :presentation's Apple shared-metadata compiles. On Linux there is no Apple
        # toolchain, so :klardrop-common's native targets are disabled (its Sentry cinterop
        # can't be processed here) and its iosMain/appleMain metadata is skipped. :presentation
        # would still try to compile its own Apple metadata, but can't resolve klardrop-common's
        # now-absent native `actual`s (e.g. InternalPlatformDependencies' constructor) and fails.
        # Apple is fully built and tested on the macOS job, so skip it here.
        run: >-
          ./gradlew build
          -x :presentation:compileIosMainKotlinMetadata
          -x :presentation:compileAppleMainKotlinMetadata

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Test Results (Linux)
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit

  # macOS only runs the targets Linux can't: the iOS simulator tests and the macOS
  # native tests. Everything else is already covered on the Linux job, so we keep
  # this minimal to save Mac runner minutes.
  build-macos:
    name: Test (macOS / iOS)
    # macos-26 ships Xcode 26 (matches local dev + Kotlin/Native's bundled SDK). The default
    # macos-latest image's Xcode 16.4 (SDK 15.5) is too old: Kotlin/Native's AppKit/CoreFoundation
    # platform klibs reference newer-SDK symbols, so the Xcode link of the macOS/iOS apps fails
    # with "Undefined symbols for architecture arm64". select-xcode pins the newest stable Xcode.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6

      # Cache ~/.konan (Kotlin/Native compiler + Apple platform libs) — outside the
      # Gradle home setup-gradle caches. Keyed on the version catalog.
      #
      # Split restore/save rather than actions/cache: the combined action's post
      # step does not save when the job failed. On a Kotlin bump the catalog hash
      # changes, so the exact key misses and restore-keys hands back the PREVIOUS
      # Kotlin's ~/.konan — useless for the new compiler, which then downloads and
      # rebuilds from scratch. That cold build is what pushes this job over its
      # budget, and the resulting failure is precisely what stops the fresh cache
      # from being written, so every retry pays the same cost again. Saving on
      # always() breaks that loop: the first attempt seeds the new Kotlin's konan
      # dir even though it went red, and the retry starts warm.
      - name: Restore Kotlin/Native (~/.konan)
        id: konan-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/dependencies.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Compile and link the native test binaries as their own step, before running
      # them. These tests talk over real loopback sockets with multi-second connect
      # and pumping deadlines, and Gradle will happily run one module's tests while
      # another module is still linking — on a runner that reports as few as 3
      # processors, that contention alone times the sockets out ("Could not connect
      # to server..."). Building first means the test step starts on an idle box.
      - name: Compile & link native tests
        # Generous: on a Kotlin bump this is a from-scratch Kotlin/Native build of
        # the compiler caches and Apple platform klibs, not an incremental one.
        timeout-minutes: 60
        run: |
          ./gradlew \
            :klardrop-common:linkDebugTestIosSimulatorArm64 \
            :presentation:linkDebugTestIosSimulatorArm64 \
            :protos:linkDebugTestIosSimulatorArm64 \
            :klardrop-common:linkDebugTestMacosArm64 \
            :presentation:linkDebugTestMacosArm64 \
            :protos:linkDebugTestMacosArm64 \
            :control-plane:linkDebugTestMacosArm64

      # Save regardless of what the tests below do — see the restore step above.
      - name: Save Kotlin/Native (~/.konan)
        if: ${{ always() && steps.konan-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/dependencies.toml') }}

      - name: Run macOS + iOS native tests
        # iOS Simulator + macOS native cover the shared KMP modules that Linux
        # cannot build (klardrop-common, presentation, protos, control-plane).
        # :control-plane is here for its macosArm64 target specifically: its
        # POSIX control-file actual, its per-platform capability set and the
        # ktor-network bind are the parts the shipped Klardrop.app runs and no
        # other job executes. :compose-ui has only android + desktopJvm targets
        # now, so it has no Apple test task and is fully covered by the Linux
        # job. The old :common-ui (renamed :compose-ui) and :macos (vestigial KN
        # stub removed in SwiftUI migration) tasks are gone.
        #
        # Step-level timeout (NOT job-level): a wedged native test — e.g. a
        # real-socket integration test whose runTest watchdog can't preempt a
        # blocked Kotlin/Native worker — otherwise runs to the 6h job default.
        # A step timeout fails just this step, so the "Publish Test Report" step
        # below (guarded on !cancelled(), which a job cancel would skip) still
        # runs and surfaces the per-test results that did complete.
        #
        # The binaries are already linked by the step above, so this budget now
        # covers test execution alone — which has historically run ~12 minutes.
        # macOS and iOS Simulator tests are run as two sequential Gradle invocations
        # with --no-parallel: a single invocation schedules both native test workers
        # at once, and on a 3-core runner that contention has been observed to push
        # real-socket tests past this 60-minute step timeout even though every test
        # that finished had passed.
        timeout-minutes: 60
        run: |
          ./gradlew --no-parallel \
            :klardrop-common:macosArm64Test \
            :presentation:macosArm64Test \
            :protos:macosArm64Test \
            :control-plane:macosArm64Test
          ./gradlew --no-parallel \
            :klardrop-common:iosSimulatorArm64Test \
            :presentation:iosSimulatorArm64Test \
            :protos:iosSimulatorArm64Test

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Test Results (macOS / iOS)
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit

      # Build the actual iOS + macOS apps (unsigned). The unit tests above do not
      # exercise the Xcode app build, so a SwiftUI / pbxproj / SKIE / framework
      # regression would otherwise slip through. Mirrors release.yml's macOS prep.
      - name: Set up JDK 21 (Apple app build uses the project's pinned JDK)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build iOS + macOS apps (unsigned)
        run: |
          # Prebuild the Sentry macOS synthetic + dummy frameworks that the
          # cocoapods integration and macOS FRAMEWORK_SEARCH_PATHS depend on, plus
          # the umbrella presentation.framework — built by :control-plane (it embeds
          # :presentation and :klardrop-common), the only Kotlin framework KlardropMac
          # links, and the module MacApp.swift's `import presentation` resolves to.
          ./gradlew :klardrop-common:podBuildSentryMacos :presentation:generateDummyFramework
          ./gradlew :control-plane:linkDebugFrameworkMacosArm64
          pod install --project-directory=iosApp
          # ARCHS=arm64: the KMP framework only builds the iosSimulatorArm64 target, so the
          # presentation.framework has no x86_64 slice. 'generic/platform=iOS Simulator'
          # otherwise also builds x86_64 and fails with "could not find module 'presentation'
          # for target 'x86_64-apple-ios-simulator'". Restrict to arm64 (CI runner is arm64).
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO ARCHS=arm64
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme KlardropMac \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO

  # The native Rust client (cli-rust/) has no Gradle wiring at all, so the Linux
  # and macOS jobs above never compile, lint or test it — a Rust-only regression
  # would be invisible to this workflow. One matrix job covers all three
  # platforms the shell is expected to run on:
  #   ubuntu-latest    — Linux, the platform with a native engine fixture;
  #   macos-14         — Apple Silicon (aarch64-apple-darwin), so the shell is
  #                      compiled for the same triple the macOS app runs on,
  #                      against the production JVM engine on the other side;
  #   windows-latest   — Windows, where the Rust client is native and talks to
  #                      the existing KMP JVM engine.
  # macos-14 (not the macos-26 image above) on purpose: this job needs no Xcode,
  # no Apple SDK and no Kotlin/Native, only a JDK-free `cargo`. The image
  # comment above is about Kotlin/Native SDK versions, which do not apply here.
  rust:
    name: Rust client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken platform must not hide the others' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    defaults:
      run:
        working-directory: cli-rust
    steps:
      - uses: actions/checkout@v7

      # The hosted images ship stable rustup with clippy and rustfmt. Printing the
      # versions makes a missing component a loud failure here instead of a
      # confusing "no such subcommand" three steps later.
      - name: Show Rust toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      # --locked everywhere: Cargo.lock is committed, and a build that silently
      # updated it would test dependency versions nobody reviewed.
      - name: Test
        shell: bash
        run: cargo test --locked

      # The interrupted-wait contract has a platform-specific half that no other
      # leg can check: on Windows the event arrives through
      # `SetConsoleCtrlHandler`, not a signal, so "the client keeps the request
      # id instead of dying on the default disposition" has to be proved with a
      # real console event aimed at a real owned child process. `cargo test`
      # above already runs it; naming it separately means a failure says which
      # gate broke, and `--nocapture` means a runner whose console could not
      # deliver the event shows that instead of a bare assertion.
      - name: Interrupted wait (Windows console event)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --locked --test interrupted_wait -- --nocapture

      - name: Lint
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Format
        shell: bash
        run: cargo fmt --all --check

  # "Compile the macOS host code on a supported runner" as a real gate rather
  # than a claim. `desktop` declares a Kotlin Multiplatform `jvm { }` target
  # (desktop/build.gradle.kts), which on an Apple Silicon runner IS the macOS
  # host build: :desktop:jvmJar compiles main against the desktopJvm actuals of
  # :klardrop-common, :presentation, :compose-ui and :control-plane, and
  # :desktop:jvmTest runs the host unit tests. The Linux job compiles the same
  # JVM target, so what this adds is the macOS host itself.
  # macos-26 matches the macOS job above (same image, same JDK, same setup-gradle
  # cache) rather than introducing a second macOS image to keep warm.
  desktop-jvm-host-macos:
    name: Compile macOS JVM host (desktop)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the macOS JVM host
        timeout-minutes: 45
        run: ./gradlew :desktop:jvmJar :desktop:jvmTest

  # The production JVM-host fixture: the Rust client against a real Kotlin/JVM
  # daemon started WITHOUT --debug, i.e. ControlPlane.forBuild(false) with the
  # production capability list. That is the host the macOS and Windows desktop
  # apps run, and the only headless JVM host in this repo (the Compose Desktop
  # app needs a display, and the runner has no xvfb). The script asserts the
  # debug-only capabilities are absent, which is the evidence that the gate is
  # exercising production control rather than a debug build.
  jvm-host-fixture:
    name: Production JVM-host fixture (Rust client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the Rust client
        working-directory: cli-rust
        run: cargo build --locked --release

      - name: Run the production JVM-host fixture
        # Generous: the script's first action is a cold `./gradlew :cli:jvmRun`,
        # which builds :cli, :klardrop-common, :presentation and :control-plane
        # for the JVM before the daemon can start. Step-level so a wedged run
        # cannot eat the whole 6h job budget.
        timeout-minutes: 45
        run: ./scripts/klardrop-jvm-host-fixture-tests.sh

  # packaging/install.sh is a release artifact: it is what users pipe from
  # raw.githubusercontent, and it is the only thing that decides whether
  # ~/.local/bin/klardrop and ~/.local/bin/klardrop-engine end up as a matched
  # pair. Nothing in the Gradle jobs above executes it, so a broken guard,
  # rollback or checksum check would ship green. The suite is hermetic (temp HOMEs +
  # stubbed uname/ldd/systemctl/pacman/install/mv/curl) and needs no Gradle, but it does
  # exercise the --jvm install path, which refuses to run without a JDK 21+ on PATH, so
  # it gets its own fast job with a JDK pinned rather than relying on the runner image's.
  packaging-tests:
    name: Installer tests (packaging/install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - name: Run the installer tests
        run: bash packaging/linux/test-omarchy-install.sh

  # The Rust client against the KOTLIN/NATIVE engine — the pairing the release
  # tarball actually ships (`bin/klardrop` + `bin/klardrop-engine`), which no
  # other job on a PR exercises: the Linux Gradle job tests the JVM host and the
  # JVM-host fixture is JVM-only. Builds the engine with the same Gradle task
  # packaging/linux/stage-native-tarball.sh requires, then runs the fixture.
  native-fixture:
    name: Native fixture (Rust client + Kotlin/Native engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6

      # The engine links against these; the same four packages the release
      # workflow's native job installs (Qt/xvfb omitted — no Qt frontend here).
      - name: Install native build deps
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libavahi-client-dev libsqlite3-dev libssl-dev libsystemd-dev

      - name: Build the Kotlin/Native engine
        # Generous: on a cold runner this downloads the Kotlin/Native compiler
        # and platform libs first, same as the macOS native tests above.
        timeout-minutes: 60
        run: ./gradlew :cli:linkReleaseExecutableLinuxX64

      # --locked, like every other Rust invocation in this workflow: Cargo.lock
      # is committed and a build that updated it would test unreviewed versions.
      - name: Build the Rust client
        working-directory: cli-rust
        run: cargo build --locked --release

      - name: Run the native fixture
        timeout-minutes: 45
        run: ./scripts/klardrop-rust-fixture-tests.sh

  # The Qt frontend against the control plane. Two suites, because they prove
  # different halves of the same contract:
  #   - linux/qt/tests/test_integration.py drives the frontend against an
  #     in-process fake daemon (focus gating, credential rotation, composer,
  #     single instance, update 409);
  #   - scripts/klardrop-qt-real-engine-tests.sh points the REAL frontend at the
  #     REAL engine and asserts the response shapes clientbridge.cpp parses, plus
  #     every request the binary actually makes.
  # Shared control code moved across three hosts in this work, so "no Qt
  # regression" has to be checked against a real engine rather than asserted by
  # grepping route strings. This is the only PR gate that does either.
  qt-regression:
    name: Qt frontend vs. the real control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Qt and native build deps
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          qt6-base-dev qt6-declarative-dev qmake6 libgl-dev
          qml6-module-qtquick qml6-module-qtquick-controls
          qml6-module-qtquick-layouts qml6-module-qtquick-templates
          qml6-module-qtquick-window qml6-module-qtqml qml6-module-qtqml-models
          qml6-module-qtqml-workerscript
          libavahi-client-dev libsqlite3-dev libssl-dev libsystemd-dev

      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/dependencies.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Build the Kotlin/Native engine
        timeout-minutes: 60
        run: ./gradlew :cli:linkReleaseExecutableLinuxX64

      - name: Qt integration suite (fake daemon)
        timeout-minutes: 30
        run: python3 linux/qt/tests/test_integration.py

      - name: Qt frontend vs. the real engine
        timeout-minutes: 30
        run: ./scripts/klardrop-qt-real-engine-tests.sh

  # The Windows release artifact, built and packaged the way release.yml builds
  # it. The `rust` matrix above covers compilation and tests on windows-latest,
  # but only in the dev profile — the release-profile build, the archive staging
  # and the container check only ever ran in the tagged `build` job, which is how
  # a tar file named `.zip` shipped without any PR noticing.
  windows-release-package:
    name: Windows release package (Rust CLI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the Rust CLI (release profile)
        working-directory: cli-rust
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release
          test -f target/release/klardrop.exe

      # Identical to release.yml's staging step, deliberately: this job exists
      # to fail when that one would. pwsh, because under `shell: bash` on
      # windows-latest `tar` is GNU tar, whose -a is --auto-compress and can never
      # produce a zip container.
      - name: Stage and verify the archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist, stage-win | Out-Null
          Copy-Item cli-rust/target/release/klardrop.exe stage-win/klardrop.exe
          Compress-Archive -Path stage-win/klardrop.exe -DestinationPath dist/klardrop-cli-windows-x64.zip -Force
          $sig = [System.IO.File]::ReadAllBytes("$PWD/dist/klardrop-cli-windows-x64.zip")[0..1]
          if ($sig[0] -ne 0x50 -or $sig[1] -ne 0x4B) {
            throw "klardrop-cli-windows-x64.zip is not a zip container (magic: $($sig -join ','))"
          }
          # And it must actually extract to the CLI, not to some other layout.
          Expand-Archive -Path dist/klardrop-cli-windows-x64.zip -DestinationPath verify -Force
          if (-not (Test-Path verify/klardrop.exe)) {
            throw "the archive does not contain klardrop.exe at its root"
          }
          Write-Host "archive verified: $((Get-Item dist/klardrop-cli-windows-x64.zip).Length) bytes"
