name: Build with Gradle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Linux carries the bulk of the test suite: common, Android host-tests, desktop JVM,
  # CLI. Kotlin/Native mac/iOS targets are skipped automatically when no Apple
  # toolchain is present, so we run a plain `./gradlew build` and let host-locking
  # decide what compiles.
  build-linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Test Results (Linux)
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit

  # macOS only runs the targets Linux can't: the iOS simulator tests and the macOS
  # native tests. Everything else is already covered on the Linux job, so we keep
  # this minimal to save Mac runner minutes.
  build-macos:
    name: Test (macOS / iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6

      - name: Run macOS + iOS native tests
        # iOS Simulator + macOS native cover the shared KMP modules that Linux
        # cannot build (klardrop-common, presentation, protos). :compose-ui has
        # only android + desktopJvm targets now, so it has no Apple test task and
        # is fully covered by the Linux job. The old :common-ui (renamed :compose-ui)
        # and :macos (vestigial KN stub removed in SwiftUI migration) tasks are gone.
        run: |
          ./gradlew \
            :klardrop-common:iosSimulatorArm64Test \
            :presentation:iosSimulatorArm64Test \
            :protos:iosSimulatorArm64Test \
            :klardrop-common:macosArm64Test \
            :presentation:macosArm64Test \
            :protos:macosArm64Test

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Test Results (macOS / iOS)
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit

      # Build the actual iOS + macOS apps (unsigned). The unit tests above do not
      # exercise the Xcode app build, so a SwiftUI / pbxproj / SKIE / framework
      # regression would otherwise slip through. Mirrors release.yml's macOS prep.
      - name: Set up JDK 21 (Apple app build uses the project's pinned JDK)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build iOS + macOS apps (unsigned)
        run: |
          # Prebuild the Bugsnag macOS synthetic + dummy frameworks that the
          # cocoapods integration and macOS FRAMEWORK_SEARCH_PATHS depend on.
          ./gradlew :klardrop-common:podBuildBugsnagMacos :presentation:generateDummyFramework
          pod install --project-directory=iosApp
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme KlardropMac \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO
