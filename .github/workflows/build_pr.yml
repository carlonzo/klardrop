name: Build with Gradle

on:
  pull_request:
    branches: main

permissions:
  contents: read

jobs:
  build:

    strategy:
      matrix:
        os: [ ubuntu-latest ] # macos-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          java-package: jdk

      - name: Gradle Build Action
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build