name: Build with Gradle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:

    strategy:
      matrix:
        os: [ ubuntu-latest ] # macos-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          java-package: jdk

      - name: Gradle Build Action
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}  
        with:
          name: Test Results
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit
