name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). A tag v<version> will be created.'
        required: true

permissions:
  contents: write

jobs:
  # Resolve the version once. The git tag `vX.Y.Z` is the single source of truth;
  # everything downstream consumes these outputs (no version is committed anywhere).
  version:
    runs-on: ubuntu-latest
    outputs:
      version:        ${{ steps.v.outputs.version }}
      packageVersion: ${{ steps.v.outputs.packageVersion }}
      tag:            ${{ steps.v.outputs.tag }}
      versionCode:    ${{ steps.v.outputs.versionCode }}
      stable:         ${{ steps.v.outputs.stable }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history — versionCode is derived from the commit count

      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TAG="v$VERSION"
          # versionCode is a single monotonic integer shared with the nightly workflow:
          #   code = (commits reachable from HEAD) * 2   [nightly adds +1]
          # "higher code = newer commit"; the stable build (even) and the nightly rebuilt
          # from the same commit by refresh-testers (odd, +1) never collide; and a later
          # commit always outranks an earlier one on either channel. Needs full git
          # history (fetch-depth: 0) and assumes main-line history only grows.
          COMMITS="$(git rev-list --count HEAD)"
          CODE=$(( COMMITS * 2 ))
          # A "stable" release is bare X.Y.Z (no pre-release suffix). Package-manager
          # bumps only run for stable versions.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then STABLE=true; else STABLE=false; fi
          # jpackage (desktop Deb/Msi/Dmg) requires a strictly numeric x.y.z and rejects a
          # pre-release suffix. Strip it for the package version (e.g. 1.0.0-rc1 -> 1.0.0);
          # klardrop.version still carries the full semver for the app's displayed/updater
          # version. For a stable tag the two are identical.
          PKGVER="${VERSION%%-*}"
          echo "version=$VERSION"        >> "$GITHUB_OUTPUT"
          echo "packageVersion=$PKGVER"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE"       >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE"          >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION packageVersion=$PKGVER tag=$TAG versionCode=$CODE commits=$COMMITS stable=$STABLE"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-android
          - os: windows-latest
            target: windows

    runs-on: ${{ matrix.os }}

    env:
      # Threaded into every gradle invocation so the build version matches the tag.
      # packageVersion is the numeric-only form jpackage accepts (no pre-release suffix);
      # klardrop.version keeps the full semver for the in-app/updater version.
      GRADLE_VERSION_ARGS: >-
        -Pklardrop.version=${{ needs.version.outputs.version }}
        -Pklardrop.packageVersion=${{ needs.version.outputs.packageVersion }}
        -Pklardrop.versionCode=${{ needs.version.outputs.versionCode }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Windows MSI
        if: matrix.target == 'windows'
        run: ./gradlew :desktop:packageReleaseMsi $GRADLE_VERSION_ARGS

      # Decode the release keystore so the APK/AAB are signed with the real upload
      # key. Without the secret (e.g. a fork) the build falls back to debug signing.
      - name: Configure Android signing
        if: matrix.target == 'linux-android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 — release APK/AAB will be debug-signed."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/klardrop-upload.jks"
          {
            echo "KLARDROP_KEYSTORE_FILE=$RUNNER_TEMP/klardrop-upload.jks"
            echo "KLARDROP_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KLARDROP_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KLARDROP_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Linux DEB + app-image + Android APK & AAB
        if: matrix.target == 'linux-android'
        run: >-
          ./gradlew
          :desktop:packageReleaseDeb
          :desktop:createReleaseDistributable
          :android:assembleRelease
          :android:bundleRelease
          $GRADLE_VERSION_ARGS

      # ProGuard gate: boot the *minified* app-image and fail the release if a
      # reflection/serialization path was stripped. debug builds can't catch this
      # because they aren't minified — only the release artifact exercises rules.pro.
      - name: Smoke-test minified release (ProGuard gate)
        if: matrix.target == 'linux-android'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y xvfb
          APP=desktop/build/compose/binaries/main-release/app/klardrop/bin/klardrop
          LOG="$(mktemp)"
          # The app runs servers + a window forever, so time-box it; we only need
          # the startup window where serialization/Wire/SQLite/jmDNS init runs.
          set +e
          timeout --preserve-status 35 xvfb-run -a "$APP" >"$LOG" 2>&1
          set -e
          echo "----- minified app log -----"; cat "$LOG"; echo "----------------------------"
          # Any of these means ProGuard broke the minified build. VerifyError +
          # "Exception in thread" are essential: both an optimizer-induced VerifyError
          # and the coroutines/Compose crashes log "Starting Klardrop" *before* dying,
          # so the boot check alone would miss them.
          if grep -Eiq "VerifyError|Exception in thread|ServiceConfigurationError|ClassNotFoundException|NoClassDefFoundError|SerializationException|Serializer for class .* is not found|MissingFieldException|kotlinx\.serialization\.[A-Za-z]*Exception|ExceptionInInitializerError" "$LOG"; then
            echo "::error::Minified release hit a reflection/serialization/verifier failure — fix desktop/rules.pro (keep rule or -dontoptimize) or the jpackage module set."
            exit 1
          fi
          # Confirm it actually reached startup (logged very early, before the window).
          grep -q "Starting Klardrop" "$LOG" || { echo "::error::Minified app did not reach startup"; exit 1; }
          echo "Minified release booted cleanly."

      - name: Stage Linux universal tarball
        if: matrix.target == 'linux-android'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          APPDIR=desktop/build/compose/binaries/main-release/app
          STAGE=stage/klardrop-linux-x64
          rm -rf stage && mkdir -p "$STAGE/icons"

          # Self-contained bundle: app-image (with bundled JRE) + launcher integration.
          # Consumed by the install.sh script (initial install + in-app self-update).
          cp -r "$APPDIR/klardrop" "$STAGE/klardrop"
          cp packaging/linux/klardrop.desktop "$STAGE/"
          cp packaging/linux/com.carlom.Klardrop.metainfo.xml "$STAGE/"
          for s in 32 64 128 256 512; do
            mkdir -p "$STAGE/icons/${s}x${s}"
            cp "brand/klardrop-icon-${s}.png" "$STAGE/icons/${s}x${s}/klardrop.png"
          done
          # Scalable SVG (the source the PNGs are rendered from): the icon theme
          # prefers it at any size, with the sized PNGs as fallback.
          mkdir -p "$STAGE/icons/scalable"
          cp brand/klardrop-icon.svg "$STAGE/icons/scalable/klardrop.svg"

          mkdir -p dist
          tar -czf dist/klardrop-linux-x64.tar.gz -C stage klardrop-linux-x64
          rm -rf stage
          ls -la dist/

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Compose Desktop drops bundlers under build/compose/binaries/main-release/<format>/
          # (or main/<format>/ for non-release). Match both so the workflow keeps working if
          # the desktop module ever stops calling proguard.
          find desktop/build/compose/binaries -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' \) \
            -exec cp -v {} dist/ \;
          if [ -d android/build/outputs/apk/release ]; then
            find android/build/outputs/apk/release -name '*.apk' -exec cp -v {} dist/ \;
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: klardrop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # The AAB is for Play Store upload, not public download — keep it as a
      # separate workflow artifact rather than a GitHub Release asset. (A future
      # Play-publish job consumes this.)
      - name: Upload Android App Bundle (AAB)
        if: matrix.target == 'linux-android'
        uses: actions/upload-artifact@v7
        with:
          name: klardrop-aab
          path: android/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  # Build + sign + notarize the native KlardropMac (Swift/SKIE) macOS app.
  # When Apple signing secrets are absent (forks / community PRs) the job still
  # builds an UNSIGNED .app/.dmg and uploads it as a CI artifact, but it does NOT
  # write macos-verified.txt and is therefore NOT published to the GitHub Release
  # as a verified download channel, and NOT consumed by the Homebrew cask.
  build-macos-native:
    needs: version
    runs-on: macos-latest
    env:
      GRADLE_VERSION_ARGS: >-
        -Pklardrop.version=${{ needs.version.outputs.version }}
        -Pklardrop.versionCode=${{ needs.version.outputs.versionCode }}
    steps:
      - uses: actions/checkout@v7

      # JDK 21 is REQUIRED — the Kotlin pod syncFramework script phase (invoked by
      # xcodebuild during the pod build phase) is pinned to JDK 21.
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v6

      # Cache ~/.konan (Kotlin/Native compiler + Apple platform libs) — outside the
      # Gradle home setup-gradle caches. Keyed on the version catalog.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/dependencies.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Build the Bugsnag synthetic CocoaPod framework for macOS (both Debug and
      # Release variants). This must run BEFORE xcodebuild because FRAMEWORK_SEARCH_PATHS
      # in the pbxproj points at common/build/cocoapods/synthetic/macos/build/{Debug,Release}/Bugsnag.
      # Only the Debug variant exists locally after local dev; CI must produce the Release variant
      # explicitly here.
      - name: Build Kotlin macOS frameworks (Bugsnag synthetic + dummy)
        run: ./gradlew :klardrop-common:podBuildBugsnagMacos :presentation:generateDummyFramework $GRADLE_VERSION_ARGS

      - name: pod install
        run: pod install --project-directory=iosApp

      - name: Detect Apple signing secrets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}" ] || [ -z "${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}" ]; then
            echo "Apple signing/notarization secrets absent — building UNSIGNED .app/.dmg."
            echo "This is a CI-only artifact and will NOT be published as a verified download."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID cert (signed builds only)
        if: steps.signing.outputs.signed == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain"
          KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC"

      - name: Archive KlardropMac
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD:   ${{ needs.version.outputs.versionCode }}
        run: |
          set -euo pipefail
          # Archive WITHOUT signing. Signing for signed builds happens in the export step
          # below (method=developer-id, automatic) — that's also where Xcode fetches the
          # Developer ID provisioning profile carrying keychain-access-groups.
          # Mixing CODE_SIGN_STYLE=Automatic with a manual CODE_SIGN_IDENTITY override is a
          # hard "conflicting provisioning settings" error on every target, so we never sign here.
          # MARKETING_VERSION/CURRENT_PROJECT_VERSION on the command line override the
          # xcconfig + every target (app + share extension), so the bundle versions
          # match the release tag and stay consistent across targets.
          # arm64-only: the Kotlin presentation.framework is built for the runner's
          # arch (Apple Silicon), so a universal (arm64+x86_64) archive fails with
          # "could not find module 'presentation' for target 'x86_64-apple-macos'".
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace -scheme KlardropMac \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/KlardropMac.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD"

      - name: Export signed .app (signed builds only)
        if: steps.signing.outputs.signed == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          TEAM_ID:    ${{ secrets.APPLE_TEAM_ID }}
          CERT_PW:    ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$API_KEY_P8" | base64 -d > "$RUNNER_TEMP/keys/AuthKey.p8"
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict>
          </plist>
          EOF
          # -allowProvisioningUpdates + API key lets Xcode fetch/create the Developer ID
          # profile and re-sign the app, nested frameworks and the share extension with the
          # Developer ID Application cert imported into the keychain.
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KlardropMac.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

          # -exportArchive (developer-id) signs the executables WITHOUT --options runtime, so
          # notarization rejects them: "The executable does not have the hardened runtime enabled"
          # (Klardrop + KlardropMacShare.appex). Re-sign inside-out WITH hardened runtime.
          #
          # exportArchive emits an empty entitlements set (the Developer ID profile carries none),
          # so re-signing from the post-export signature drops app-sandbox, app-groups, network,
          # etc. A share extension MUST stay sandboxed or the host app won't even launch
          # (RunningBoard "Launchd job spawn failed", POSIX 163). Re-sign each bundle from its repo
          # .entitlements instead, expanding $(AppIdentifierPrefix) -> TEAMID. so no Xcode variable
          # leaks in. This also restores the team-prefixed keychain-access-groups (without it the
          # data-protection keychain fails with errSecMissingEntitlement and macOS pops a "enter
          # your keychain password" dialog on every signing op).
          APP="$RUNNER_TEMP/export/Klardrop.app"

          # A sandboxed Developer ID app declaring an App Group must ship an embedded
          # provisioning profile or macOS refuses to spawn it (RunningBoard 163).
          # exportArchive (method=developer-id) does NOT embed one, so create + embed the
          # Developer ID profiles ourselves (one per bundle id) BEFORE re-signing seals them.
          CERT_SERIAL="$(openssl pkcs12 -legacy -in "$RUNNER_TEMP/cert.p12" -nokeys -passin pass:"$CERT_PW" 2>/dev/null | openssl x509 -noout -serial | cut -d= -f2)"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/embed_devid_profiles.py \
            --p8 "$RUNNER_TEMP/keys/AuthKey.p8" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER" --team "$TEAM_ID" --cert-serial "$CERT_SERIAL" \
            --bundle "com.carlom.Klardrop=$APP/Contents/embedded.provisionprofile" \
            --bundle "com.carlom.Klardrop.MacShare=$APP/Contents/PlugIns/KlardropMacShare.appex/Contents/embedded.provisionprofile"

          resign() {
            local bundle="$1" src="$2" appid="$3" ent
            ent="$(mktemp)"
            sed "s/\$(AppIdentifierPrefix)/${TEAM_ID}./g" "$src" > "$ent"
            # An embedded provisioning profile only authorizes restricted entitlements
            # (application-groups, keychain) when the signed code ALSO declares the matching
            # com.apple.application-identifier — that's the key macOS uses to bind the profile
            # to the binary. Xcode injects it automatically; a manual --entitlements re-sign
            # does not, so the profile never applies, the app group stays unauthorized and the
            # app dies at launch (RunningBoard "Launchd job spawn failed", POSIX 163).
            /usr/libexec/PlistBuddy \
              -c "Add :com.apple.application-identifier string ${TEAM_ID}.${appid}" \
              -c "Add :com.apple.developer.team-identifier string ${TEAM_ID}" "$ent"
            codesign --force --options runtime --timestamp \
              --sign "Developer ID Application" --entitlements "$ent" "$bundle"
          }
          # extension first so the app's outer signature seals the re-signed extension
          resign "$APP/Contents/PlugIns/KlardropMacShare.appex" "iosApp/Klardrop Mac Share/KlardropMacShare.entitlements" "com.carlom.Klardrop.MacShare"
          resign "$APP" "iosApp/iosApp/KlardropMac.entitlements" "com.carlom.Klardrop"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # don't ship a broken build. These pass codesign/spctl/notarization yet die at launch
          # with RunningBoard "Launchd job spawn failed" (POSIX 163):
          #  - an app extension that isn't sandboxed, or
          #  - a bundle declaring an App Group with no embedded provisioning profile to authorize it.
          codesign -d --entitlements - --xml "$APP/Contents/PlugIns/KlardropMacShare.appex" 2>/dev/null \
            | grep -q "com.apple.security.app-sandbox" \
            || { echo "::error::app-sandbox missing from KlardropMacShare.appex"; exit 1; }
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q "${TEAM_ID}.com.carlom.Klardrop" \
            || { echo "::error::keychain-access-groups missing from signed Klardrop.app"; exit 1; }
          for b in "$APP" "$APP/Contents/PlugIns/KlardropMacShare.appex"; do
            codesign -d --entitlements - --xml "$b" 2>/dev/null \
              | grep -q "com.apple.security.application-groups" || continue
            test -f "$b/Contents/embedded.provisionprofile" \
              || { echo "::error::$b declares an App Group but has no embedded.provisionprofile -> will fail to launch (163). The embed_devid_profiles.py step did not embed it."; exit 1; }
            codesign -d --entitlements - --xml "$b" 2>/dev/null \
              | grep -q "com.apple.application-identifier" \
              || { echo "::error::$b is missing com.apple.application-identifier -> the embedded profile won't bind, App Group stays unauthorized, app fails to launch (163)."; exit 1; }
          done

      - name: Stage .app, notarize, build DMG
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          VERSION:    ${{ needs.version.outputs.version }}
          SIGNED:     ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          if [ "$SIGNED" = "true" ]; then
            APP="$RUNNER_TEMP/export/Klardrop.app"
          else
            APP="$RUNNER_TEMP/KlardropMac.xcarchive/Products/Applications/Klardrop.app"
          fi
          cp -R "$APP" stage/

          if [ "$SIGNED" = "true" ]; then
            mkdir -p "$RUNNER_TEMP/keys"
            echo "$API_KEY_P8" | base64 -d > "$RUNNER_TEMP/keys/AuthKey.p8"
            AUTH=(--key "$RUNNER_TEMP/keys/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER")
            # Submit one file and fail on anything but Accepted. `submit --wait` exits 0 even when
            # the result is Invalid, so parse the status and, on failure, dump the notary log
            # (which names the offending files) before exiting.
            notarize() {
              local f="$1" out id status
              out="$(xcrun notarytool submit "$f" "${AUTH[@]}" --wait --output-format json)"
              echo "$out"
              id="$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
              status="$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
              if [ "$status" != "Accepted" ]; then
                echo "::error::Notarization $status for $f — see log below"
                xcrun notarytool log "$id" "${AUTH[@]}" || true
                exit 1
              fi
            }

            # Notarize + staple the .app FIRST so the notarization ticket is embedded in the
            # bundle. Homebrew copies Klardrop.app OUT of the DMG into /Applications, where the
            # DMG's own staple is unreachable; without an app-level ticket Gatekeeper falls back
            # to an online notarization lookup, which fails offline / behind firewalls and shows
            # "Apple could not verify Klardrop is free of malware" on first launch. Stapling the
            # app lets Gatekeeper validate it with no network.
            ditto -c -k --keepParent stage/Klardrop.app "$RUNNER_TEMP/Klardrop.app.zip"
            notarize "$RUNNER_TEMP/Klardrop.app.zip"
            xcrun stapler staple stage/Klardrop.app
          fi

          ln -s /Applications stage/Applications
          hdiutil create -volname Klardrop -srcfolder stage -ov -format UDZO \
            "dist/klardrop-${VERSION}.dmg"

          # Notarize + staple the DMG too, so a direct .dmg download is trusted on first open.
          if [ "$SIGNED" = "true" ]; then
            notarize "dist/klardrop-${VERSION}.dmg"
            xcrun stapler staple "dist/klardrop-${VERSION}.dmg"
            # Marker file: its presence in the release indicates a notarized build.
            # latest.json and the Homebrew job both gate on this file existing.
            echo "verified" > dist/macos-verified.txt
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: klardrop-macos
          # Always upload the DMG (for debugging even unsigned builds).
          # macos-verified.txt is only present when notarization succeeded.
          path: dist/*
          if-no-files-found: error

  # Publish the AAB to Google Play (production). Gated on the service-account secret
  # + a stable version (pre-release tags don't touch production; nightlies go to the
  # internal track from a separate scheduled workflow). The first-ever upload, the
  # store listing, and Play App Signing enrollment must be done MANUALLY in the Play
  # Console before this job can succeed — see docs/RELEASE_RUNBOOK.md §3.
  play-publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Guard (service-account token present + stable version)
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          OK=true
          if [ -z "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON not set — skipping Play publish."; OK=false
          fi
          if [ "${{ needs.version.outputs.stable }}" != "true" ]; then
            echo "Pre-release version — skipping Play production publish."; OK=false
          fi
          echo "ok=$OK" >> "$GITHUB_OUTPUT"

      - name: Download AAB
        if: steps.guard.outputs.ok == 'true'
        uses: actions/download-artifact@v8
        with:
          name: klardrop-aab
          path: aab

      - name: Upload to Google Play (production track)
        if: steps.guard.outputs.ok == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.carlom.klardrop
          releaseFiles: aab/*.aab
          track: production
          status: completed

  publish:
    needs: [version, build, build-macos-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums + latest.json
        shell: bash
        env:
          REPO:    ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG:     ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          # SHA256 sidecar per asset (also uploaded to the release).
          for f in *; do
            if [ -f "$f" ] && [[ "$f" != *.sha256 ]] && [[ "$f" != "latest.json" ]]; then
              sha256sum "$f" | awk '{print $1}' > "$f.sha256"
            fi
          done

          # Pick the canonical asset for each platform (first match wins — Compose
          # Desktop only emits one of each format per host).
          pick() { ls $1 2>/dev/null | head -n1 || true; }
          DMG=$(pick "*.dmg")
          MSI=$(pick "*.msi")
          DEB=$(pick "*.deb")
          APK=$(pick "*.apk")
          TGZ=$(pick "*.tar.gz")

          export BASE="https://github.com/${REPO}/releases/download/${TAG}"
          python3 - "$DMG" "$MSI" "$DEB" "$APK" "$TGZ" <<'PY' > latest.json
          import json, os, sys, datetime, pathlib
          dmg, msi, deb, apk, tgz = sys.argv[1:6]
          base = os.environ["BASE"]
          def entry(name):
              if not name: return None
              digest = pathlib.Path(name + ".sha256").read_text().strip()
              size   = pathlib.Path(name).stat().st_size
              return {"url": f"{base}/{name}", "sha256": digest, "size": size}
          platforms = {}
          # macOS is only advertised in latest.json when a notarized native DMG is
          # present (macos-verified.txt written by the notarize step). Without it
          # the native .dmg is uploaded as a raw CI artifact but is NOT listed as a
          # verified download channel (unsigned build — not suitable for public distribution).
          if dmg and os.path.exists("macos-verified.txt"): platforms["macos"] = entry(dmg)
          if msi: platforms["windows"]       = entry(msi)
          if deb: platforms["linux-deb"]     = entry(deb)
          if tgz: platforms["linux-tarball"] = entry(tgz)
          if apk: platforms["android"]       = entry(apk)
          out = {
            "version":     os.environ["VERSION"],
            "tag":         os.environ["TAG"],
            "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "notes":       f"https://github.com/{os.environ['REPO']}/releases/tag/{os.environ['TAG']}",
            "platforms":   platforms,
          }
          print(json.dumps(out, indent=2))
          PY
          cat latest.json

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name:     Klardrop ${{ needs.version.outputs.version }}
          files:    artifacts/*
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Bump the Homebrew cask in the carlonzo/homebrew-klardrop tap. Gated on the
  # tap token + a stable version.
  homebrew:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Guard (token present + stable version + verified native DMG)
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG:      ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          OK=true
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping Homebrew publish."; OK=false
          fi
          if [ "${{ needs.version.outputs.stable }}" != "true" ]; then
            echo "Version is a pre-release — skipping Homebrew publish."; OK=false
          fi
          # Require a verified (signed + notarized) native macOS DMG in the release.
          # The build-macos-native job writes macos-verified.txt only when notarization
          # succeeds. Without Apple signing secrets the unsigned .dmg is NOT published
          # as a verified Homebrew channel.
          if ! gh release view "$TAG" --repo "${{ github.repository }}" \
               --json assets --jq '.assets[].name' 2>/dev/null | grep -q 'macos-verified.txt'; then
            echo "No verified (notarized) macOS DMG in release — skipping Homebrew."; OK=false
          fi
          echo "ok=$OK" >> "$GITHUB_OUTPUT"

      - name: Render cask
        if: steps.guard.outputs.ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG:      ${{ needs.version.outputs.tag }}
          VERSION:  ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Hash the exact published DMG so the cask checksum matches what users download.
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.dmg' --dir dmg
          DMG="$(ls dmg/*.dmg | head -n1)"
          SHA="$(sha256sum "$DMG" | awk '{print $1}')"
          mkdir -p cask
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA}/g" \
            packaging/homebrew/klardrop.rb > cask/klardrop.rb
          echo "--- rendered cask ---"; cat cask/klardrop.rb

      - name: Push to tap
        if: steps.guard.outputs.ok == 'true'
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION:   ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/carlonzo/homebrew-klardrop.git" tap
          mkdir -p tap/Casks
          cp cask/klardrop.rb tap/Casks/klardrop.rb   # casks MUST live under Casks/
          cd tap
          git config user.name "klardrop-ci"
          git config user.email "carlo.marinangeli@gmail.com"
          git add Casks/klardrop.rb
          git commit -m "klardrop ${VERSION}" || { echo "no cask change"; exit 0; }
          git push

  # After a stable release, refresh the tester tracks (Play internal + TestFlight +
  # nightly prerelease) with the just-released commit so testers are never behind
  # production. Dispatches the nightly workflow against the release tag with
  # force=true (bypassing its no-new-commits gate); the nightly assigns a fresh,
  # higher versionCode so it supersedes the previous nightly on every tester track.
  # Requires release-nightly.yml to exist on the tagged commit.
  refresh-testers:
    needs: [version, publish]
    if: needs.version.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch nightly for the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG:      ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release-nightly.yml \
            --repo "${{ github.repository }}" \
            --ref "$TAG" -f force=true
