name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). A tag v<version> will be created.'
        required: true

permissions:
  contents: write

jobs:
  # Resolve the version once. The git tag `vX.Y.Z` is the single source of truth;
  # everything downstream consumes these outputs (no version is committed anywhere).
  version:
    runs-on: ubuntu-latest
    outputs:
      version:     ${{ steps.v.outputs.version }}
      tag:         ${{ steps.v.outputs.tag }}
      versionCode: ${{ steps.v.outputs.versionCode }}
      stable:      ${{ steps.v.outputs.stable }}
    steps:
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TAG="v$VERSION"
          # versionCode = major*10000 + minor*100 + patch (pre-release suffix stripped).
          CORE="${VERSION%%-*}"
          IFS='.' read -r MA MI PA <<< "$CORE"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          # A "stable" release is bare X.Y.Z (no pre-release suffix). Package-manager
          # bumps only run for stable versions.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then STABLE=true; else STABLE=false; fi
          echo "version=$VERSION"        >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE"       >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE"          >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION tag=$TAG versionCode=$CODE stable=$STABLE"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-android
          - os: windows-latest
            target: windows

    runs-on: ${{ matrix.os }}

    env:
      # Threaded into every gradle invocation so the build version matches the tag.
      GRADLE_VERSION_ARGS: >-
        -Pklardrop.version=${{ needs.version.outputs.version }}
        -Pklardrop.versionCode=${{ needs.version.outputs.versionCode }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Windows MSI
        if: matrix.target == 'windows'
        run: ./gradlew :desktop:packageReleaseMsi $GRADLE_VERSION_ARGS

      # Decode the release keystore so the APK/AAB are signed with the real upload
      # key. Without the secret (e.g. a fork) the build falls back to debug signing.
      - name: Configure Android signing
        if: matrix.target == 'linux-android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 — release APK/AAB will be debug-signed."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/klardrop-upload.jks"
          {
            echo "KLARDROP_KEYSTORE_FILE=$RUNNER_TEMP/klardrop-upload.jks"
            echo "KLARDROP_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KLARDROP_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KLARDROP_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Linux DEB + app-image + Android APK & AAB
        if: matrix.target == 'linux-android'
        run: >-
          ./gradlew
          :desktop:packageReleaseDeb
          :desktop:createReleaseDistributable
          :android:assembleRelease
          :android:bundleRelease
          $GRADLE_VERSION_ARGS

      # ProGuard gate: boot the *minified* app-image and fail the release if a
      # reflection/serialization path was stripped. debug builds can't catch this
      # because they aren't minified — only the release artifact exercises rules.pro.
      - name: Smoke-test minified release (ProGuard gate)
        if: matrix.target == 'linux-android'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y xvfb
          APP=desktop/build/compose/binaries/main-release/app/klardrop/bin/klardrop
          LOG="$(mktemp)"
          # The app runs servers + a window forever, so time-box it; we only need
          # the startup window where serialization/Wire/SQLite/jmDNS init runs.
          set +e
          timeout --preserve-status 35 xvfb-run -a "$APP" >"$LOG" 2>&1
          set -e
          echo "----- minified app log -----"; cat "$LOG"; echo "----------------------------"
          # Any of these means ProGuard broke the minified build. VerifyError +
          # "Exception in thread" are essential: both an optimizer-induced VerifyError
          # and the coroutines/Compose crashes log "Starting Klardrop" *before* dying,
          # so the boot check alone would miss them.
          if grep -Eiq "VerifyError|Exception in thread|ServiceConfigurationError|ClassNotFoundException|NoClassDefFoundError|SerializationException|Serializer for class .* is not found|MissingFieldException|kotlinx\.serialization\.[A-Za-z]*Exception|ExceptionInInitializerError" "$LOG"; then
            echo "::error::Minified release hit a reflection/serialization/verifier failure — fix desktop/rules.pro (keep rule or -dontoptimize) or the jpackage module set."
            exit 1
          fi
          # Confirm it actually reached startup (logged very early, before the window).
          grep -q "Starting Klardrop" "$LOG" || { echo "::error::Minified app did not reach startup"; exit 1; }
          echo "Minified release booted cleanly."

      - name: Stage Linux universal tarball
        if: matrix.target == 'linux-android'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          APPDIR=desktop/build/compose/binaries/main-release/app
          STAGE=stage/klardrop-linux-x64
          rm -rf stage && mkdir -p "$STAGE/icons"

          # Self-contained bundle: app-image (with bundled JRE) + launcher integration.
          # Consumed by the install.sh script (initial install + in-app self-update).
          cp -r "$APPDIR/klardrop" "$STAGE/klardrop"
          cp packaging/linux/klardrop.desktop "$STAGE/"
          cp packaging/linux/com.carlom.Klardrop.metainfo.xml "$STAGE/"
          for s in 32 64 128 256 512; do
            mkdir -p "$STAGE/icons/${s}x${s}"
            cp "brand/klardrop-icon-${s}.png" "$STAGE/icons/${s}x${s}/klardrop.png"
          done
          # Scalable SVG (the source the PNGs are rendered from): the icon theme
          # prefers it at any size, with the sized PNGs as fallback.
          mkdir -p "$STAGE/icons/scalable"
          cp brand/klardrop-icon.svg "$STAGE/icons/scalable/klardrop.svg"

          mkdir -p dist
          tar -czf dist/klardrop-linux-x64.tar.gz -C stage klardrop-linux-x64
          rm -rf stage
          ls -la dist/

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Compose Desktop drops bundlers under build/compose/binaries/main-release/<format>/
          # (or main/<format>/ for non-release). Match both so the workflow keeps working if
          # the desktop module ever stops calling proguard.
          find desktop/build/compose/binaries -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' \) \
            -exec cp -v {} dist/ \;
          if [ -d android/build/outputs/apk/release ]; then
            find android/build/outputs/apk/release -name '*.apk' -exec cp -v {} dist/ \;
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: klardrop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # The AAB is for Play Store upload, not public download — keep it as a
      # separate workflow artifact rather than a GitHub Release asset. (A future
      # Play-publish job consumes this.)
      - name: Upload Android App Bundle (AAB)
        if: matrix.target == 'linux-android'
        uses: actions/upload-artifact@v7
        with:
          name: klardrop-aab
          path: android/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  # Build + sign + notarize the native KlardropMac (Swift/SKIE) macOS app.
  # When Apple signing secrets are absent (forks / community PRs) the job still
  # builds an UNSIGNED .app/.dmg and uploads it as a CI artifact, but it does NOT
  # write macos-verified.txt and is therefore NOT published to the GitHub Release
  # as a verified download channel, and NOT consumed by the Homebrew cask.
  build-macos-native:
    needs: version
    runs-on: macos-latest
    env:
      GRADLE_VERSION_ARGS: >-
        -Pklardrop.version=${{ needs.version.outputs.version }}
        -Pklardrop.versionCode=${{ needs.version.outputs.versionCode }}
    steps:
      - uses: actions/checkout@v6

      # JDK 21 is REQUIRED — the Kotlin pod syncFramework script phase (invoked by
      # xcodebuild during the pod build phase) is pinned to JDK 21.
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v6

      # Build the Bugsnag synthetic CocoaPod framework for macOS (both Debug and
      # Release variants). This must run BEFORE xcodebuild because FRAMEWORK_SEARCH_PATHS
      # in the pbxproj points at common/build/cocoapods/synthetic/macos/build/{Debug,Release}/Bugsnag.
      # Only the Debug variant exists locally after local dev; CI must produce the Release variant
      # explicitly here.
      - name: Build Kotlin macOS frameworks (Bugsnag synthetic + dummy)
        run: ./gradlew :klardrop-common:podBuildBugsnagMacos :presentation:generateDummyFramework $GRADLE_VERSION_ARGS

      - name: pod install
        run: pod install --project-directory=iosApp

      - name: Detect Apple signing secrets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}" ] || [ -z "${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}" ]; then
            echo "Apple signing/notarization secrets absent — building UNSIGNED .app/.dmg."
            echo "This is a CI-only artifact and will NOT be published as a verified download."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID cert (signed builds only)
        if: steps.signing.outputs.signed == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain"
          KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC"

      - name: Archive KlardropMac
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            SIGN_ARGS="CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=Developer ID Application DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}"
          else
            SIGN_ARGS="CODE_SIGNING_ALLOWED=NO"
          fi
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme KlardropMac \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/KlardropMac.xcarchive" archive $SIGN_ARGS

      - name: Stage .app + build DMG
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          cp -R "$RUNNER_TEMP/KlardropMac.xcarchive/Products/Applications/Klardrop.app" stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname Klardrop -srcfolder stage -ov -format UDZO \
            "dist/klardrop-${VERSION}.dmg"

      - name: Notarize + staple (signed builds only)
        if: steps.signing.outputs.signed == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          VERSION:    ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$API_KEY_P8" | base64 -d > "$RUNNER_TEMP/keys/AuthKey.p8"
          xcrun notarytool submit "dist/klardrop-${VERSION}.dmg" \
            --key "$RUNNER_TEMP/keys/AuthKey.p8" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER" \
            --wait
          xcrun stapler staple "dist/klardrop-${VERSION}.dmg"
          # Marker file: its presence in the release indicates a notarized build.
          # latest.json and the Homebrew job both gate on this file existing.
          echo "verified" > dist/macos-verified.txt

      - uses: actions/upload-artifact@v7
        with:
          name: klardrop-macos
          # Always upload the DMG (for debugging even unsigned builds).
          # macos-verified.txt is only present when notarization succeeded.
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, build, build-macos-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums + latest.json
        shell: bash
        env:
          REPO:    ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG:     ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          # SHA256 sidecar per asset (also uploaded to the release).
          for f in *; do
            if [ -f "$f" ] && [[ "$f" != *.sha256 ]] && [[ "$f" != "latest.json" ]]; then
              sha256sum "$f" | awk '{print $1}' > "$f.sha256"
            fi
          done

          # Pick the canonical asset for each platform (first match wins — Compose
          # Desktop only emits one of each format per host).
          pick() { ls $1 2>/dev/null | head -n1 || true; }
          DMG=$(pick "*.dmg")
          MSI=$(pick "*.msi")
          DEB=$(pick "*.deb")
          APK=$(pick "*.apk")
          TGZ=$(pick "*.tar.gz")

          export BASE="https://github.com/${REPO}/releases/download/${TAG}"
          python3 - "$DMG" "$MSI" "$DEB" "$APK" "$TGZ" <<'PY' > latest.json
          import json, os, sys, datetime, pathlib
          dmg, msi, deb, apk, tgz = sys.argv[1:6]
          base = os.environ["BASE"]
          def entry(name):
              if not name: return None
              digest = pathlib.Path(name + ".sha256").read_text().strip()
              size   = pathlib.Path(name).stat().st_size
              return {"url": f"{base}/{name}", "sha256": digest, "size": size}
          platforms = {}
          # macOS is only advertised in latest.json when a notarized native DMG is
          # present (macos-verified.txt written by the notarize step). Without it
          # the native .dmg is uploaded as a raw CI artifact but is NOT listed as a
          # verified download channel (unsigned build — not suitable for public distribution).
          if dmg and os.path.exists("macos-verified.txt"): platforms["macos"] = entry(dmg)
          if msi: platforms["windows"]       = entry(msi)
          if deb: platforms["linux-deb"]     = entry(deb)
          if tgz: platforms["linux-tarball"] = entry(tgz)
          if apk: platforms["android"]       = entry(apk)
          out = {
            "version":     os.environ["VERSION"],
            "tag":         os.environ["TAG"],
            "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "notes":       f"https://github.com/{os.environ['REPO']}/releases/tag/{os.environ['TAG']}",
            "platforms":   platforms,
          }
          print(json.dumps(out, indent=2))
          PY
          cat latest.json

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name:     Klardrop ${{ needs.version.outputs.version }}
          files:    artifacts/*
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Bump the Homebrew cask in the carlonzo/homebrew-klardrop tap. Gated on the
  # tap token + a stable version.
  homebrew:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Guard (token present + stable version + verified native DMG)
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG:      ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          OK=true
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping Homebrew publish."; OK=false
          fi
          if [ "${{ needs.version.outputs.stable }}" != "true" ]; then
            echo "Version is a pre-release — skipping Homebrew publish."; OK=false
          fi
          # Require a verified (signed + notarized) native macOS DMG in the release.
          # The build-macos-native job writes macos-verified.txt only when notarization
          # succeeds. Without Apple signing secrets the unsigned .dmg is NOT published
          # as a verified Homebrew channel.
          if ! gh release view "$TAG" --repo "${{ github.repository }}" \
               --json assets --jq '.assets[].name' 2>/dev/null | grep -q 'macos-verified.txt'; then
            echo "No verified (notarized) macOS DMG in release — skipping Homebrew."; OK=false
          fi
          echo "ok=$OK" >> "$GITHUB_OUTPUT"

      - name: Render cask
        if: steps.guard.outputs.ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG:      ${{ needs.version.outputs.tag }}
          VERSION:  ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Hash the exact published DMG so the cask checksum matches what users download.
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.dmg' --dir dmg
          DMG="$(ls dmg/*.dmg | head -n1)"
          SHA="$(sha256sum "$DMG" | awk '{print $1}')"
          mkdir -p cask
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA}/g" \
            packaging/homebrew/klardrop.rb > cask/klardrop.rb
          echo "--- rendered cask ---"; cat cask/klardrop.rb

      - name: Push to tap
        if: steps.guard.outputs.ok == 'true'
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION:   ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/carlonzo/homebrew-klardrop.git" tap
          mkdir -p tap/Casks
          cp cask/klardrop.rb tap/Casks/klardrop.rb   # casks MUST live under Casks/
          cd tap
          git config user.name "klardrop-ci"
          git config user.email "carlo.marinangeli@gmail.com"
          git add Casks/klardrop.rb
          git commit -m "klardrop ${VERSION}" || { echo "no cask change"; exit 0; }
          git push
